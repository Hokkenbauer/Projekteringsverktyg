  p.meetings.unshift({id:uid(), date:todayISO(), title:'Statusmöte', attendees:'', notes:''});
  markDirty(); renderMain();
}
function renderMeetings(el){
  const p = getProject(state.ui.meetingsProjectId);
  if(!p){ el.innerHTML = `<div class="empty-state">Skapa ett projekt först.</div>`; return; }
  if(!p.meetings.length){ el.innerHTML = `<div class="empty-state">Inga möten loggade för ${escapeHtml(p.name)} ännu.</div>`; return; }
  const sorted = [...p.meetings].sort((a,b)=> b.date.localeCompare(a.date));
  el.innerHTML = sorted.map(m=>`
    <div class="meeting-card" data-meeting="${m.id}">
      <div class="mhead">
        <input type="date" data-m-date="${m.id}" value="${m.date}">
        <input data-m-title="${m.id}" value="${escapeHtml(m.title)}" style="flex:1;font-weight:700;">
        <button class="icon-btn" data-m-del="${m.id}">🗑</button>
      </div>
      <div class="field"><label>Deltagare</label><input data-m-att="${m.id}" value="${escapeHtml(m.attendees)}"></div>
      <div class="field"><label>Anteckningar</label><textarea rows="4" data-m-notes="${m.id}">${escapeHtml(m.notes)}</textarea></div>
    </div>`).join('');
  el.querySelectorAll('[data-m-date]').forEach(n=> n.addEventListener('change', ()=>{ findMeeting(n.dataset.mDate).date=n.value; markDirty(); }));
  el.querySelectorAll('[data-m-title]').forEach(n=> n.addEventListener('change', ()=>{ findMeeting(n.dataset.mTitle).title=n.value; markDirty(); }));
  el.querySelectorAll('[data-m-att]').forEach(n=> n.addEventListener('change', ()=>{ findMeeting(n.dataset.mAtt).attendees=n.value; markDirty(); }));
  el.querySelectorAll('[data-m-notes]').forEach(n=> n.addEventListener('input', debounce(()=>{ findMeeting(n.dataset.mNotes).notes=n.value; markDirty(); },300)));
  el.querySelectorAll('[data-m-del]').forEach(n=> n.addEventListener('click', ()=>{ if(confirm('Ta bort mötet?')){ p.meetings = p.meetings.filter(m=>m.id!==n.dataset.mDel); markDirty(); renderMain(); } }));
  function findMeeting(id){ return p.meetings.find(m=>m.id===id); }
}

/* ======================= NOTES VIEW ======================= */
function renderNotes(el){
  const p = getProject(state.ui.notesProjectId);
  if(!p){ el.innerHTML = `<div class="empty-state">Skapa ett projekt först.</div>`; return; }
  el.innerHTML = `<h3 style="margin-top:0;">Anteckningar – ${escapeHtml(p.name)}</h3>
    <textarea class="notes-box" id="notesArea" placeholder="Skriv fria anteckningar för projektet här…">${escapeHtml(p.notes)}</textarea>
    <div class="hint" id="notesSaved" style="margin-top:6px;">Sparas automatiskt.</div>`;
  document.getElementById('notesArea').addEventListener('input', debounce(()=>{
    p.notes = document.getElementById('notesArea').value; markDirty();
    document.getElementById('notesSaved').textContent = 'Sparat ✓';
  },300));
}

/* ======================= SETTINGS MODAL ======================= */
function openSettings(){
  const root = document.getElementById('modal-root');
  let activeTab = 'resources';
  function draw(){
    root.innerHTML = `<div class="overlay" id="settingsOverlay"><div class="modal">
      <div class="modal-head"><h3>Inställningar</h3><button class="icon-btn" id="closeSettings">✖</button></div>
      <div class="settings-tabs">
        <div class="settings-tab ${activeTab==='resources'?'active':''}" data-st="resources">Resurser</div>
        <div class="settings-tab ${activeTab==='statuses'?'active':''}" data-st="statuses">Statusar</div>
        <div class="settings-tab ${activeTab==='data'?'active':''}" data-st="data">Data</div>
      </div>
      <div class="modal-body" id="settingsBody"></div>
      <div class="modal-foot"><button class="btn primary" id="doneSettings">Klart</button></div>
    </div></div>`;
    document.getElementById('closeSettings').onclick = ()=>{ root.innerHTML=''; renderAll(); };
    document.getElementById('doneSettings').onclick = ()=>{ root.innerHTML=''; renderAll(); };
    document.getElementById('settingsOverlay').addEventListener('click', e=>{ if(e.target.id==='settingsOverlay'){ root.innerHTML=''; renderAll(); } });
    root.querySelectorAll('[data-st]').forEach(n=> n.addEventListener('click', ()=>{ activeTab=n.dataset.st; draw(); }));
    const body = document.getElementById('settingsBody');
    if(activeTab==='resources') drawResources(body);
    else if(activeTab==='statuses') drawStatuses(body);
    else drawData(body);
  }
  function drawResources(body){
    body.innerHTML = `<div class="hint" style="margin-bottom:10px;">Döp om de 10 resurserna till riktiga namn och välj en färg.</div>` + state.resources.map(r=>`
      <div class="res-row" data-rrow="${r.id}">
        <span class="swatch" style="background:${r.color}"></span>
        <input data-r-name="${r.id}" value="${escapeHtml(r.name)}" style="flex:1;">
        <input data-r-init="${r.id}" value="${escapeHtml(r.initials)}" maxlength="3" style="width:50px;text-align:center;" title="Initialer">
      </div>
      <div class="palette" data-r-palette="${r.id}" style="margin:2px 0 10px 32px;">${PALETTE.map(c=>`<div class="swatch ${c===r.color?'selected':''}" data-r-color="${r.id}" data-color="${c}" style="background:${c};cursor:pointer;"></div>`).join('')}</div>
    `).join('');
    body.querySelectorAll('[data-r-name]').forEach(n=> n.addEventListener('change', ()=>{ getResource(n.dataset.rName).name = n.value.trim()||'Resurs'; markDirty(); renderAll(); }));
    body.querySelectorAll('[data-r-init]').forEach(n=> n.addEventListener('change', ()=>{ getResource(n.dataset.rInit).initials = n.value.trim()||'?'; markDirty(); renderAll(); }));
    body.querySelectorAll('[data-r-color]').forEach(n=> n.addEventListener('click', ()=>{ getResource(n.dataset.rColor).color = n.dataset.color; markDirty(); drawResources(body); renderAll(); }));
  }
  function drawStatuses(body){
    body.innerHTML = `<div class="hint" style="margin-bottom:10px;">Lägg till, döp om eller ta bort statusar.</div>` + state.statuses.map(s=>`
      <div class="status-row" data-srow="${s.id}">
        <span class="swatch" style="background:${s.color}"></span>
        <input data-s-name="${s.id}" value="${escapeHtml(s.name)}" style="flex:1;">
        <button class="icon-btn" data-s-del="${s.id}">🗑</button>
      </div>
      <div class="palette" style="margin:2px 0 10px 32px;">${PALETTE.map(c=>`<div class="swatch ${c===s.color?'selected':''}" data-s-color="${s.id}" data-color="${c}" style="background:${c};cursor:pointer;"></div>`).join('')}</div>
    `).join('') + `<button class="btn" id="addStatus" style="margin-top:6px;">+ Ny status</button>`;
    body.querySelectorAll('[data-s-name]').forEach(n=> n.addEventListener('change', ()=>{ state.statuses.find(s=>s.id===n.dataset.sName).name = n.value.trim()||'Status'; markDirty(); renderAll(); }));
    body.querySelectorAll('[data-s-color]').forEach(n=> n.addEventListener('click', ()=>{ state.statuses.find(s=>s.id===n.dataset.sColor).color = n.dataset.color; markDirty(); drawStatuses(body); renderAll(); }));
    body.querySelectorAll('[data-s-del]').forEach(n=> n.addEventListener('click', ()=>{
      if(state.statuses.length<=1){ toast('Minst en status krävs.'); return; }
      if(confirm('Ta bort statusen? Objekt som använder den får första statusen istället.')){
        const removedId = n.dataset.sDel;
        const fallback = state.statuses.find(s=>s.id!==removedId).id;
        state.statuses = state.statuses.filter(s=>s.id!==removedId);
        state.projects.forEach(p=> p.items.forEach(it=>{ if(it.statusId===removedId) it.statusId=fallback; it.subItems.forEach(si=>{ if(si.statusId===removedId) si.statusId=fallback; }); }));
        markDirty(); drawStatuses(body); renderAll();
      }
    }));
    document.getElementById('addStatus').onclick = ()=>{
      state.statuses.push({id:uid(), name:'Ny status', color:PALETTE[state.statuses.length%PALETTE.length]});
      markDirty(); drawStatuses(body); renderAll();
    };
  }
  function drawData(body){
    body.innerHTML = `
      <div class="hint" style="margin-bottom:12px;">Extra säkerhetskopiering utöver "Spara"-knappen som skriver hela verktygsfilen.</div>
      <button class="btn" id="exportJson">⇩ Exportera data (JSON)</button>
      <button class="btn" id="importJson">⇧ Importera data (JSON)</button>
      <input type="file" id="importJsonFile" accept="application/json" style="display:none;">
      <hr style="border-color:var(--border);margin:16px 0;">
      <button class="btn" id="clearDemo" style="border-color:#f0b429;color:#f0b429;">Rensa exempeldata (behåll resurser/statusar)</button>
      <br><br>
      <button class="btn" id="wipeAll" style="border-color:#f2727f;color:#f2727f;">Radera all data</button>
    `;
    document.getElementById('exportJson').onclick = ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='resursplanering-data.json'; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    };
    document.getElementById('importJson').onclick = ()=> document.getElementById('importJsonFile').click();
    document.getElementById('importJsonFile').addEventListener('change', e=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{ const parsed = JSON.parse(reader.result); if(!parsed.projects||!parsed.resources) throw new Error('bad shape');
          state = parsed; markDirty(); root.innerHTML=''; renderAll(); toast('Data importerad.');
        }catch(err){ alert('Kunde inte läsa filen som giltig data.'); }
      };
      reader.readAsText(file);
    });
    document.getElementById('clearDemo').onclick = ()=>{
      if(confirm('Tar bort alla projekt och objekt (resurser och statusar behålls). Fortsätt?')){
        state.projects = []; markDirty(); root.innerHTML=''; renderAll();
      }
    };
    document.getElementById('wipeAll').onclick = ()=>{
      if(confirm('Detta raderar ALLT (projekt, resurser, statusar). Kan inte ångras. Fortsätt?')){
        state = defaultState(); state.projects=[]; markDirty(); root.innerHTML=''; renderAll();
      }
    };
  }
  draw();
}

/* ======================= EXPORT: XLSX ======================= */
async function exportExcel(){
  if(typeof ExcelJS==='undefined'){ toast('Excel-biblioteket kunde inte laddas (kräver internetuppkoppling).'); return; }
  const wb = new ExcelJS.Workbook();
  wb.creator = 'Resursplanering';
  wb.created = new Date();

  // ---- Sheet 1: Data (flat list, for filtering/pivoting) ----
  const ws = wb.addWorksheet('Data');
  ws.columns = [
    {header:'Projekt', key:'project', width:26},
    {header:'Objekt', key:'item', width:26},
    {header:'Underobjekt', key:'sub', width:22},
    {header:'Resurser', key:'res', width:24},
    {header:'Status', key:'status', width:18},
    {header:'Start', key:'start', width:12},
    {header:'Slut', key:'end', width:12},
    {header:'Arbetstimmar', key:'hours', width:14},
    {header:'Antal resurser på plats', key:'hc', width:20}
  ];
  ws.getRow(1).eachCell(c=> c.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF262347'}});
  ws.getRow(1).font = {bold:true, color:{argb:'FFFFFFFF'}};
  function addRow(vals, statusColor){
    const row = ws.addRow(vals);
    if(statusColor){ row.getCell('status').fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF'+statusColor.replace('#','').toUpperCase()}}; row.getCell('status').font={color:{argb:'FF15132A'},bold:true}; }
  }
  state.projects.forEach(p=>{
    p.items.forEach(it=>{
      const st = getStatus(it.statusId);
      addRow({project:p.name, item:it.name, sub:'', res:it.resourceIds.map(id=>getResource(id)?.name).filter(Boolean).join(', '), status:st.name, start:it.start||'', end:it.end||'', hours:itemHours(it)||'', hc: it.headcount==null?'':it.headcount}, st.color);
      it.subItems.forEach(si=>{
        const sst = getStatus(si.statusId);
        addRow({project:p.name, item:it.name, sub:si.name, res:si.resourceIds.map(id=>getResource(id)?.name).filter(Boolean).join(', '), status:sst.name, start:si.start||'', end:si.end||'', hours:itemHours(si)||'', hc:si.headcount==null?'':si.headcount}, sst.color);
      });
    });
  });

  // ---- Sheet 2: Gantt (klassisk Gantt-layout: #, uppgift, varaktighet, start/slut + tidslinje) ----
  const gs = wb.addWorksheet('Gantt');
  const model = buildExportModel();
  const granularity = state.ui.ganttZoom==='week' ? 'week' : 'month';
  const cols = buildTimeColumns(model.min, model.max, granularity);
  const bands = computeBands(cols, granularity);
  const INFO_COLS = 6;

  gs.getColumn(1).width = 5;
  gs.getColumn(2).width = 34;
  gs.getColumn(3).width = 11;
  gs.getColumn(4).width = 11;
  gs.getColumn(5).width = 11;
  gs.getColumn(6).width = 11;
  for(let i=0;i<cols.length;i++) gs.getColumn(INFO_COLS+1+i).width = granularity==='week' ? 4.2 : 8.5;

  const headerFill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFDFE3EC'}};
  const subHeaderFill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFF2F3F7'}};

  gs.mergeCells(1,1,2,1); gs.getCell(1,1).value = '#';
  gs.mergeCells(1,2,2,2); gs.getCell(1,2).value = 'Uppgift';
  gs.mergeCells(1,3,2,3); gs.getCell(1,3).value = 'Arbetsdagar';
  gs.mergeCells(1,4,2,4); gs.getCell(1,4).value = 'Timmar';
  gs.mergeCells(1,5,2,5); gs.getCell(1,5).value = 'Start';
  gs.mergeCells(1,6,2,6); gs.getCell(1,6).value = 'Slut';
  for(let c=1;c<=INFO_COLS;c++){ const cell=gs.getCell(1,c); cell.font={bold:true,size:10}; cell.alignment={horizontal:'center',vertical:'middle'}; cell.fill=headerFill; }

  let colCursor = INFO_COLS+1;
  bands.forEach(b=>{
    gs.mergeCells(1, colCursor, 1, colCursor+b.count-1);
    const cell = gs.getCell(1, colCursor);
    cell.value = b.label; cell.alignment = {horizontal:'center', vertical:'middle'}; cell.font = {bold:true, size:9}; cell.fill = headerFill;
    colCursor += b.count;
  });
  cols.forEach((c,i)=>{
    const cell = gs.getRow(2).getCell(INFO_COLS+1+i);
    cell.value = c.label; cell.font = {size:8};
    cell.alignment = {textRotation: granularity==='week'?60:0, horizontal:'center', vertical:'middle'};
    cell.fill = subHeaderFill;
  });
  gs.getRow(1).height = 18;
  gs.getRow(2).height = granularity==='week' ? 44 : 16;

  const thin = {style:'thin', color:{argb:'FFD9D9D9'}};
  const borderAll = {top:thin,left:thin,bottom:thin,right:thin};
  const todayIso = todayISO();

  model.rows.forEach((r,idx)=>{
    const rowIdx = idx+3;
    const row = gs.getRow(rowIdx);
    row.height = 15;
    row.getCell(1).value = r.num;
    row.getCell(2).value = r.name;
    row.getCell(2).alignment = {indent:r.level*2};
    row.getCell(3).value = (r.start && r.end && !r.milestone) ? workHours(r.start,r.end)/8 : null; // arbetsdagar mån–fre
    row.getCell(4).value = r.hours || null;
    row.getCell(5).value = r.start || '';
    row.getCell(6).value = r.end || '';
    if(r.isGroup) row.getCell(2).font = {bold:true};
    // NOTE: deliberately no row.outlineLevel here. Setting an Excel outline
    // level on these rows was tried previously (for collapsible groups) but
    // it caused most sub-item rows to render as collapsed/invisible in both
    // LibreOffice and real Excel even though they were not flagged "hidden" —
    // confirmed by reproducing the export against a real 83-row project and
    // visually inspecting the rendered PDF. Removed as the fix for that bug.
    for(let c=1;c<=INFO_COLS;c++){
      row.getCell(c).border = borderAll;
      if(r.isGroup) row.getCell(c).fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FFEFF1F6'}};
    }
    for(let i=0;i<cols.length;i++){
      const c = cols[i];
      const cell = row.getCell(INFO_COLS+1+i);
      cell.border = borderAll;
      if(todayIso>=c.start && todayIso<c.end && !r.isGroup){ cell.border = Object.assign({}, borderAll, {left:{style:'thin',color:{argb:'FFE04B4B'}}, right:{style:'thin',color:{argb:'FFE04B4B'}}}); }
      if(r.start && r.end){
        const overlaps = r.start < c.end && r.end >= c.start;
        if(overlaps){
          if(r.isGroup) cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF222222'}};
          else if(r.milestone){ cell.value = '◆'; cell.font = {bold:true, color:{argb:'FF222222'}}; cell.alignment = {horizontal:'center'}; }
          else cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF'+(r.color||'#3b6fd6').replace('#','').toUpperCase()}};
        }
      }
    }
  });
  // ---- Teckenförklaring: resursfärger i en ruta under Gantt-schemat ----
  let lr = model.rows.length + 5;
  const box = {style:'medium', color:{argb:'FF8A93A6'}};
  const legendRows = [{title:true, name:'Teckenförklaring – resurser (färg på staplar)'}]
    .concat((model.legend||[]).map(l=>({name:l.name, color:l.color})))
    .concat([{name:'Projekt / sammanfattning', color:'#222222'}, {name:'Milstolpe', mark:'◆'}]);
  legendRows.forEach((L,i)=>{
    const row = gs.getRow(lr+i);
    gs.mergeCells(lr+i, 2, lr+i, 4);
    const c1 = row.getCell(1), c2 = row.getCell(2);
    if(L.title){ c1.value=''; c2.value=L.name; c2.font={bold:true,size:10}; c1.fill=headerFill; c2.fill=headerFill; }
    else {
      c2.value = L.name; c2.font={size:10};
      if(L.color) c1.fill = {type:'pattern',pattern:'solid',fgColor:{argb:'FF'+L.color.replace('#','').toUpperCase()}};
      if(L.mark){ c1.value=L.mark; c1.alignment={horizontal:'center'}; c1.font={bold:true}; }
    }
    const top = i===0 ? box : thin, bottom = i===legendRows.length-1 ? box : thin;
    c1.border = {top, bottom, left:box, right:thin};
    for(let c=2;c<=4;c++) row.getCell(c).border = {top, bottom, left:thin, right: c===4?box:thin};
  });
  gs.views = [{state:'frozen', xSplit:INFO_COLS, ySplit:2}];

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gantt-export.xlsx'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Excel-fil nedladdad (klassisk Gantt-flik + datatabell).');
}

/* ======================= EXPORT: PDF ======================= */
async function exportPdf(){
  if(typeof html2canvas==='undefined' || !window.jspdf){ toast('PDF-biblioteken kunde inte laddas (kräver internetuppkoppling).'); return; }
  toast('Skapar PDF …');
  const model = buildExportModel();
  const granularity = state.ui.ganttZoom==='week' ? 'week' : 'month';
  const title = document.getElementById('titleInput').value || 'Resursplanering';

  const hidden = document.createElement('div');
  hidden.style.cssText = 'position:fixed;top:0;left:-100000px;z-index:-1;';
  hidden.innerHTML = renderClassicGanttHTML(model, granularity, title);
  document.body.appendChild(hidden);
  await new Promise(r=>setTimeout(r,60));
  try{
    const canvas = await html2canvas(hidden.firstElementChild, {backgroundColor:'#ffffff', scale:2});
    const { jsPDF } = window.jspdf;
    const wPt = canvas.width * 0.75, hPt = canvas.height * 0.75;
    const margin = 20;
    const pdf = new jsPDF({orientation: wPt>hPt?'l':'p', unit:'pt', format:[wPt+margin*2, hPt+margin*2]});
    pdf.setFillColor(255,255,255); pdf.rect(0,0,wPt+margin*2,hPt+margin*2,'F');
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, wPt, hPt);
    pdf.save('gantt-export.pdf');
    toast('PDF nedladdad (klassisk Gantt).');
  }catch(e){ console.error(e); toast('Kunde inte skapa PDF.'); }
  finally{ hidden.remove(); }
}

/* ======================= INIT ======================= */
function init(){
  loadInitialState();
  document.getElementById('titleInput').value = state.title || document.getElementById('titleInput').value;
  document.getElementById('titleInput').addEventListener('change', e=>{ state.title = e.target.value; markDirty(); });
  document.getElementById('btnConnectFile').addEventListener('click', connectFile);
  document.getElementById('btnSaveFile').addEventListener('click', saveToFile);
  document.getElementById('btnSettings').addEventListener('click', openSettings);
  tryRestoreFileHandle();
  renderAll();
  updateSaveIndicator();
  window.addEventListener('beforeunload', (e)=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();

})();
