name: Hämta appens logg

# Körs för hand (Actions → Hämta appens logg → Run workflow) när något gått fel i appen.
# Visar de senaste felen ur appens logg i Azure.
on:
  workflow_dispatch:

jobs:
  logg:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Logga in i Azure (utan lösenord, via GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Visa de senaste felen
        run: |
          az webapp log download --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_NAME }}" --log-file logg.zip
          mkdir -p logg && unzip -q -o logg.zip -d logg
          for f in $(ls -t $(find logg -type f -name '*.log') 2>/dev/null | head -6); do
            echo "===== $f"
            grep -n -i -A25 "exception\|fail:" "$f" | tail -n 200 || true
            # Som annoteringar också, så att felen syns i körningens sammanfattning.
            grep -i -A14 "exception\|fail:" "$f" | tail -n 120 | cut -c1-400 | split -l 30 - del_ || true
            for d in del_*; do
              [ -f "$d" ] || continue
              text=$(sed 's/%/%25/g' "$d" | awk 'BEGIN{ORS="%0A"} {print}')
              echo "::warning title=$(basename "$f") $d::$text"
              rm -f "$d"
            done
          done
