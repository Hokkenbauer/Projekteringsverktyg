name: Bygg och publicera

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bygg:
    name: Bygg och testa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bygg webbappen
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Bygg servern
        run: |
          dotnet restore Projekteringsverktyg.slnx
          dotnet build Projekteringsverktyg.slnx -c Release --no-restore

      - name: Kör tester
        run: dotnet test Projekteringsverktyg.slnx -c Release --no-build --verbosity normal

      - name: Paketera
        run: dotnet publish server/src/Projekteringsverktyg.Server/Projekteringsverktyg.Server.csproj -c Release --no-build -o app

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: app
          retention-days: 7

  publicera-test:
    name: Publicera till testmiljön
    needs: bygg
    # Körs först när Azure-uppgifterna är inlagda som variabler i GitHub (se README).
    if: github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - name: Logga in i Azure (utan lösenord, via GitHub OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sätt versionsnummer
        run: |
          az webapp config appsettings set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --settings APP_VERSION="${GITHUB_SHA::7}" \
            --output none

      - name: Publicera
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: app

      - name: Kontrollera att appen svarar
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"; then exit 0; fi
            sleep 10
          done
          echo "Appen svarade inte inom 5 minuter." >&2
          exit 1
