const CTS = ["", "-T-", "T", "|", "===", "---"];
const openGroups = new Set();

function groupKey(p){
  if (p && p.g) return p.g;
  const name = String(p && p.p !== undefined ? p.p : p);
  const m = name.match(/^([A-Za-z]+)(\d)/);
  if (m) return m[1].toUpperCase() + m[2] + "xxx";
  const a = name.match(/^[A-Za-z]+/);
  return a ? a[0].toUpperCase() : "…";
}
function allGroups(){
  const s = new Set(GROUPS);
  DATA.forEach(p => s.add(groupKey(p)));
  return [...s].sort();
}
function catRows(list){
  const c = t().c;
  return `<table class="cat"><thead><tr>
      <th>${esc(c.thArt)}</th><th>${esc(c.thDesc)}</th>
      <th class="n">${esc(c.thE)}</th><th class="n">${esc(c.thK)}</th><th class="n">${esc(c.thW)}</th>
      <th class="c">+</th><th class="c">−</th><th class="c">PE</th><th></th></tr></thead><tbody>` +
    list.map(p => `<tr>
      <td class="a">${esc(p.p)}${p.cu ? `<span class="tagcu">${esc(c.own)}</span>` :
        p.ed ? `<span class="tagcu" style="background:var(--ink-2)">${esc(c.edited)}</span>` : ""}</td>
      <td><div class="d">${esc(lang === "de" ? p.dd : p.de)}</div></td>
      <td class="n">${isNum(p.e) ? p.e : ""}</td>
      <td class="n">${isNum(p.k) ? p.k : ""}</td>
      <td class="n">${isNum(p.w) ? p.w : ""}</td>
      <td class="c">${esc(p.a || "")}</td><td class="c">${esc(p.b || "")}</td><td class="c">${esc(p.c || "")}</td>
      <td class="act"><button class="addbtn" data-add="${esc(p.p)}" title="${esc(c.addToConf)}">+</button></td>
    </tr>`).join("") + `</tbody></table>`;
}
function renderCat(){
  const c = t().c, q = $("cat-q").value.trim().toLowerCase();
  const list = q
    ? DATA.filter(p => p.p.toLowerCase().includes(q) ||
        String(lang === "de" ? p.dd : p.de).toLowerCase().includes(q))
    : DATA;
  const groups = new Map();
  for (const p of list){
    const k = groupKey(p);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  if (!q) GROUPS.forEach(g => { if (!groups.has(g)) groups.set(g, []); });
  const keys = [...groups.keys()].sort();
  const autoOpen = q && list.length <= 400;
  $("cat-count").textContent = DATA.length;
  $("cat-hits").textContent = c.hits(list.length) + " · " + c.groups(keys.length);
  $("cat-list").innerHTML = keys.map(k => {
    const open = autoOpen || openGroups.has(k);
    return `<details class="grp" data-g="${esc(k)}"${open ? " open" : ""}>
      <summary>${esc(k)}<span class="n">${groups.get(k).length}</span></summary>
      ${open ? catRows(groups.get(k)) : ""}</details>`;
  }).join("") || `<div class="cb-empty">${esc(t().noHit)}</div>`;
}
$("cat-q").addEventListener("input", renderCat);
$("cat-collapse").onclick = () => { openGroups.clear(); $("cat-q").value = ""; renderCat(); };
$("cat-list").addEventListener("toggle", e => {
  const d = e.target.closest("details"); if (!d) return;
  const k = d.dataset.g;
  if (d.open){ openGroups.add(k); if (!d.querySelector("table")){
      const q = $("cat-q").value.trim().toLowerCase();
      const list = DATA.filter(p => groupKey(p) === k &&
        (!q || p.p.toLowerCase().includes(q) ||
         String(lang === "de" ? p.dd : p.de).toLowerCase().includes(q)));
      d.insertAdjacentHTML("beforeend", catRows(list));
    } }
  else openGroups.delete(k);
}, true);
$("cat-list").addEventListener("click", e => {
  const d = e.target.closest(".d");
  if (d){ d.classList.toggle("full"); return; }
  const b = e.target.closest("[data-add]");
  if (!b) return;
  ensureRail();
  while (rows.length > 1 && !rows[rows.length - 1].d && !rows[rows.length - 1].p.trim()) rows.pop();
  rows.push({p:b.dataset.add, c:""}, {p:"", c:""});
  render();
  document.querySelector('.tab[data-pg="pg-conf"]').click();
  document.querySelector(`tr[data-i="${rows.length - 2}"]`)?.scrollIntoView?.({block:"center"});
});

/* ================= article editor ================= */
let editKey = null;

function fillSwatches(id){
  const c = t().c, el = $(id), cur = el.dataset.v || "";
  el.innerHTML = `<button type="button" class="auto${cur ? "" : " sel"}" data-c="">${esc(c.gAuto)}</button>` +
    PALETTE.map(col => `<button type="button" class="${cur === col ? "sel" : ""}"
      style="background:${col}" data-c="${col}" title="${col}"></button>`).join("");
}
function setSwatch(id, v){ $(id).dataset.v = v || ""; fillSwatches(id); }
["a-bg","a-tc"].forEach(id => $(id).addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  setSwatch(id, b.dataset.c);
}));

function fillSelects(){
  const c = t().c;
  fillSwatches("a-bg"); fillSwatches("a-tc");
  ["a-c0","a-c1","a-c2"].forEach(id => {
    const sel = $(id), v = sel.value;
    sel.innerHTML = CTS.map(o =>
      `<option value="${esc(o)}">${esc(o === "" ? c.ctNone : o)}</option>`).join("");
    sel.value = v;
  });
  const g = $("a-g"), gv = g.value;
  g.innerHTML = `<option value="">${esc(c.gAuto)}</option>` +
    allGroups().map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("");
  g.value = gv;
}

function renderEd(){
  const c = t().c, q = $("ed-q").value.trim().toLowerCase();
  const list = (q ? DATA.filter(p => p.p.toLowerCase().includes(q) ||
        String(lang === "de" ? p.dd : p.de).toLowerCase().includes(q))
      : DATA.filter(p => p.cu || p.ed)).slice(0, 200);
  $("find-count").textContent = q ? list.length : (list.length || "");
  $("ed-list").innerHTML = list.length ? list.map(p => `<div class="edrow${
      p.p === editKey ? " on" : ""}" data-e="${esc(p.p)}">
      <b>${esc(p.p)}</b><i>${esc(String(lang === "de" ? p.dd : p.de).split("\n")[0])}</i>
      <em>${esc(groupKey(p))}${p.cu ? " · " + c.own : p.ed ? " · " + c.edited : ""}</em></div>`).join("")
    : `<div class="cb-empty">${esc(q ? t().noHit : c.editHint)}</div>`;
}
$("ed-q").addEventListener("input", renderEd);
$("ed-list").addEventListener("click", e => {
  const row = e.target.closest("[data-e]"); if (!row) return;
  loadArticle(row.dataset.e);
});

function loadArticle(name){
  const p = BY.get(name); if (!p) return;
  editKey = name;
  $("a-art").value = p.p;
  $("a-w").value = isNum(p.w) ? p.w : "";
  $("a-e").value = isNum(p.e) ? p.e : "";
  $("a-k").value = isNum(p.k) ? p.k : "";
  $("a-de").value = p.de || "";
  $("a-dd").value = p.dd || "";
  $("a-c0").value = p.a || ""; $("a-c1").value = p.b || ""; $("a-c2").value = p.c || "";
  $("a-g").value = p.g || "";
  setSwatch("a-bg", p.bg); setSwatch("a-tc", p.tc);
  $("a-err").textContent = "";
  editMode();
  renderEd();
  $("a-art").scrollIntoView?.({block:"nearest"});
}
function editMode(){
  const c = t().c;
  $("l-new").textContent = editKey ? c.editArt + " " + editKey : c.newArt;
  $("a-add").textContent = editKey ? c.save : c.add;
  $("a-del").hidden = !editKey;
  $("a-del").textContent = c.del;
  $("a-reset").textContent = c.newBtn;
}
const numOrNull = v => v.trim() === "" ? null : (isNaN(+v) ? null : +v);

$("a-add").onclick = () => {
  const c = t().c, name = $("a-art").value.trim();
  const err = m => { $("a-err").textContent = m; };
  if (!name) return err(c.needName);
  const clash = BY.get(name);
  if (clash && clash.p !== editKey) return err(c.dup);
  const de = $("a-de").value.trim(), dd = $("a-dd").value.trim();
  const obj = {p:name, e:numOrNull($("a-e").value), k:numOrNull($("a-k").value),
    w:numOrNull($("a-w").value), de:de || dd, dd:dd || de,
    a:$("a-c0").value, b:$("a-c1").value, c:$("a-c2").value};
  if ($("a-g").value) obj.g = $("a-g").value;
  if ($("a-bg").dataset.v) obj.bg = $("a-bg").dataset.v;
  if ($("a-tc").dataset.v) obj.tc = $("a-tc").dataset.v;
  if (editKey){
    const i = DATA.findIndex(p => p.p === editKey), old = DATA[i];
    if (old.cu) obj.cu = 1; else obj.ed = 1;
    DATA[i] = obj;
    if (editKey !== name) rows.forEach(r => { if (!r.d && r.p === editKey) r.p = name; });
    editKey = name;
  } else { obj.cu = 1; DATA.push(obj); }
  DATA.sort((x,y) => x.p.localeCompare(y.p));
  indexData(); err("");
  editMode(); fillSelects(); renderEd(); renderGroups(); renderCat(); render();
};
$("a-del").onclick = () => {
  if (!editKey) return;
  const c = t().c;
  if (!confirm(c.confirmDel.replace("%s", editKey))) return;
  DATA = DATA.filter(p => p.p !== editKey);
  indexData(); $("a-reset").click();
  renderEd(); renderGroups(); renderCat(); render();
};
$("a-reset").onclick = () => {
  editKey = null;
  ["a-art","a-w","a-e","a-k","a-de","a-dd"].forEach(id => $(id).value = "");
  ["a-c0","a-c1","a-c2","a-g"].forEach(id => $(id).value = "");
  setSwatch("a-bg", ""); setSwatch("a-tc", "");
  $("a-err").textContent = "";
  editMode(); renderEd();
};

/* ---- groups ---- */
function renderGroups(){
  const c = t().c, count = new Map();
  DATA.forEach(p => { const k = groupKey(p); count.set(k, (count.get(k) || 0) + 1); });
  const keys = allGroups();
  $("grp-count").textContent = keys.length;
  $("grp-list").innerHTML = keys.map(k => {
    const n = count.get(k) || 0;
    return `<div class="grow"><input value="${esc(k)}" data-g="${esc(k)}" spellcheck="false">
      <span class="n">${n}</span>
      ${n === 0 ? `<button class="addbtn" data-gdel="${esc(k)}" title="${esc(c.del)}">✕</button>`
                : `<span style="width:24px"></span>`}</div>`;
  }).join("");
}
$("grp-list").addEventListener("change", e => {
  const el = e.target.closest("input[data-g]"); if (!el) return;
  const old = el.dataset.g, nw = el.value.trim();
  if (!nw || nw === old){ el.value = old; return; }
  DATA.forEach(p => { if (groupKey(p) === old) p.g = nw; });
  const i = GROUPS.indexOf(old);
  if (i >= 0) GROUPS[i] = nw;
  renderGroups(); fillSelects(); renderCat(); renderEd();
});
$("grp-list").addEventListener("click", e => {
  const b = e.target.closest("[data-gdel]"); if (!b) return;
  GROUPS = GROUPS.filter(g => g !== b.dataset.gdel);
  renderGroups(); fillSelects(); renderCat();
});
$("grp-add").onclick = () => {
  const v = $("grp-new").value.trim();
  if (!v) return;
  if (!allGroups().includes(v)) GROUPS.push(v);
  $("grp-new").value = "";
  renderGroups(); fillSelects(); renderCat();
};

/* write the whole tool, with the edited catalogue, to a new HTML file */
$("b-html").onclick = () => {
  const ver = ($("newver").value.trim() || VERSION).replace(/[^0-9.]/g, "") || VERSION;
  const ds = document.getElementById("dataset"), keep = ds.textContent;
  ds.textContent = JSON.stringify({articles:DATA, groups:GROUPS}).replace(/</g, "\\u003c");

  const vol = ["tbody","thead","strip","rv-stats","issues","bom","stats","legend",
               "cat-list","ed-list","grp-list","print-report"];
  const bak = {};
  vol.forEach(id => { bak[id] = $(id).innerHTML; $(id).innerHTML = ""; });
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  vol.forEach(id => $(id).innerHTML = bak[id]);
  ds.textContent = keep;

  html = html.replace(/const VERSION = "[^"]*"/, 'const VERSION = "' + ver + '"');
  html = html.replace(/let logoData = "[^"]*"/, "let logoData = " + JSON.stringify(logoData));
  dl(new Blob([html], {type:"text/html;charset=utf-8"}), "kbus-kontroll-v" + ver + ".html");

  const p = ver.split(".");
  p[p.length - 1] = String(+p[p.length - 1] + 1);
  $("newver").value = p.join(".");
};

/* language */
function applyLang(){
  const x = t();
  document.documentElement.lang = lang;
  document.title = x.title;
  $("h-title").textContent = x.title;
  $("l-proj").textContent = x.proj; $("l-lang").textContent = x.lang;
  $("b-add").textContent = x.add; $("b-div").textContent = x.d.addDiv;
  $("b-paste").textContent = x.paste;
  $("b-example").textContent = x.example; $("b-clear").textContent = x.clear;
  $("b-desc").textContent = document.body.classList.contains("nodesc") ? x.showDesc : x.hideDesc;
  $("b-open").textContent = x.open; $("b-save").textContent = x.save;
  $("b-csv").textContent = x.csv; $("b-pdf").textContent = x.pdf;
  const lt = $("logo-txt"); if (lt) lt.textContent = x.logoTxt;
  $("logo").title = x.logoTip;
  $("l-rail").innerHTML = esc(x.railT) + ' <span>— ' + esc(x.railSub) + '</span>';
  $("pdlg-title").textContent = x.pdlgT; $("pdlg-help").textContent = x.pdlgH;
  $("pd-land").textContent = x.pdLand; $("pd-port").textContent = x.pdPort;
  $("pd-desc-l").textContent = x.pdDesc; $("pdlg-ok").textContent = x.pdlgOk;
  $("pdlg-cancel").textContent = x.dlgCancel;
  $("l-check").childNodes[0].nodeValue = x.check;
  const c = x.c;
  $("t-conf").textContent = c.tabConf; $("t-cat").textContent = c.tabCat; $("t-add").textContent = c.tabAdd;
  $("l-cat").childNodes[0].nodeValue = c.cat; $("cat-q").placeholder = c.search;
  $("cat-collapse").textContent = c.collapse;
  $("l-find").childNodes[0].nodeValue = c.find; $("ed-q").placeholder = c.search;
  $("l-grp").childNodes[0].nodeValue = c.groupsT;
  $("grp-new").placeholder = c.newGroup; $("grp-add").textContent = c.addGroup;
  $("f1").textContent = c.fArt; $("f2").textContent = c.fW; $("f3").textContent = c.fE;
  $("f4").textContent = c.fK; $("f5").textContent = c.fDe; $("f6").textContent = c.fDd;
  $("f7").textContent = c.fCt; $("f8").textContent = c.fG;
  $("f9").textContent = c.fBg; $("f10").textContent = c.fTc; $("a-hint").textContent = c.hint;
  $("exp-hint").textContent = c.expHint; $("l-ver").textContent = c.ver;
  $("b-html").textContent = c.saveHtml;
  $("ver").textContent = "v" + VERSION;
  $("b-theme").title = document.body.classList.contains("dark") ? x.light : x.dark;
  fillSelects(); editMode();
  $("l-sum").textContent = x.sum; $("l-bom").childNodes[0].nodeValue = x.bom;
  $("l-leg").textContent = x.leg;
  $("dlg-title").textContent = x.dlgT; $("dlg-help").textContent = x.dlgH;
  $("dlg-ok").textContent = x.dlgOk; $("dlg-cancel").textContent = x.dlgCancel;
}
$("lang").onchange = e => { lang = e.target.value; applyLang(); render(); };
document.addEventListener("click", e => { if (cb && !e.target.closest(".cb")) closeCb(); });

applyLang();
showLogo();
render();
renderEd();
renderGroups();
</script>
</body>
</html>
