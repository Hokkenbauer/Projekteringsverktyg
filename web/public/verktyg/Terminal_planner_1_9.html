<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-bus / E-bus konfigurationskontroll</title>
<style>
:root{
  --bx:#CC0000;            /* Beckhoff-röd accent */
  --bx-dark:#9E0000;
  --ink:#1A1A1A;
  --ink-2:#4D4D4D;
  --ink-3:#8C8C8C;
  --line:#DCDCDC;
  --line-2:#BFBFBF;
  --grey-bg:var(--row-line);
  --grey-head:#E9E9E9;
  --white:#FFFFFF;
  --blue:#00648D;          /* matningsvärden */
  --green:#3E8E2F;
  --shade:#E9E9E9;
  --red-soft:#FBE6E6;
  --focus:#00648D;
  --bx-txt:#CC0000;
  --hover:#F7F9FA; --row-line:#F0F0F0; --sel:#FDECEC; --soft:#FAFAFA;
  --input-bg:#FFFFFF; --focus-bg:#EAF3F7; --div-bg:#E4E4E4; --div-bg2:#DCDCDC;
}
body.dark{
  color-scheme:dark;
  --bx:#CC0000; --bx-dark:#A80000; --bx-txt:#FF6257;
  --ink:#E7E9EA; --ink-2:#AFB5B9; --ink-3:#7E858A;
  --line:#33383D; --line-2:#4A5257;
  --grey-bg:#15181A; --grey-head:#272C30; --white:#1D2124;
  --blue:#5CB4DA; --green:#5FBF6A; --shade:#2C3237; --red-soft:#4B2020;
  --focus:#5CB4DA;
  --hover:#242A2E; --row-line:#2C3236; --sel:#3A2220; --soft:#1A1E21;
  --input-bg:#252A2E; --focus-bg:#20323B; --div-bg:#2B3136; --div-bg2:#333A40;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--grey-bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,"Segoe UI",system-ui,sans-serif;
  font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
#print-report{display:none}
svg .svg-lbl{fill:var(--ink-3)}
svg .svg-ln{stroke:var(--line-2);fill:none}

/* ---------- header ---------- */
.topbar{background:var(--bx);color:#fff}
.topbar h1{color:#fff}
.topbar h1 small{color:rgba(255,255,255,.88)}
.topbar .field label{color:rgba(255,255,255,.92)}
.topbar .field input,.topbar .field select{border-color:rgba(255,255,255,.55);
  background:#FFFFFF;color:#141414;color-scheme:light}
.topbar .field input::placeholder{color:var(--ink-3)}
.themebtn{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;
  width:30px;height:30px;font-size:14px;line-height:1;padding:0;align-self:center}
.themebtn:hover{background:rgba(255,255,255,.16)}
.ver{font-size:11px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.6);
  padding:1px 7px;align-self:flex-start;margin-top:2px;letter-spacing:.02em}
.topbar .field input:focus,.topbar .field select:focus{border-color:#fff;outline-color:#fff}
.topbar .logo{border:1px dashed rgba(255,255,255,.75);background:transparent;color:rgba(255,255,255,.92)}
.topbar .logo.set{background:#fff;padding:3px 7px;border:none}
.topbar .logo.set img{height:32px}
.topbar .inner{max-width:1620px;margin:0 auto;padding:14px 22px;
  display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.brand{display:flex;align-items:center;gap:14px;min-height:38px}
.logo{
  height:38px;min-width:38px;border:1px dashed var(--line-2);background:var(--white);
  display:flex;align-items:center;justify-content:center;padding:0 10px;
  font-size:11px;color:var(--ink-3);cursor:pointer;
}
.logo.set{border:none;padding:0}
.logo img{height:38px;width:auto;display:block}
h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
h1 small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:1px}
.head-fields{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-left:auto}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:10.5px;color:var(--ink-2)}
.field input,.field select{background:var(--white);border:1px solid var(--line-2);border-radius:0;
  padding:5px 8px;min-width:132px}
.field input:focus,.field select:focus{border-color:var(--focus)}

/* ---------- toolbar ---------- */
.toolbar{background:var(--white);border-bottom:1px solid var(--line)}
.toolbar .inner{max-width:1620px;margin:0 auto;padding:9px 22px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:var(--white);border:1px solid var(--line-2);border-radius:0;
  padding:6px 12px;font-size:12.5px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3);background:var(--hover)}
.btn:active{background:var(--grey-head)}
.btn.primary{background:var(--bx);border-color:var(--bx);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--bx-dark);border-color:var(--bx-dark)}
.spacer{flex:1}

/* ---------- rail view ---------- */
.railview{max-width:1620px;margin:16px auto 0;padding:0 22px}
.railview-inner{background:var(--white);border:1px solid var(--line)}
.rv-head{display:flex;align-items:center;gap:16px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rv-title{font-size:12px;font-weight:600}
.rv-title span{font-weight:400;color:var(--ink-3)}
.rv-stats{margin-left:auto;display:flex;gap:20px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.rv-stats b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.rv-stats b.neg{color:var(--bx)}
.strip{overflow-x:auto;padding:12px 14px}
.strip svg{display:block}
.zoom{display:flex;gap:0;margin-left:12px}
.zoom button{border:1px solid var(--line-2);background:var(--white);width:24px;height:24px;
  line-height:1;font-size:14px;padding:0;margin-left:-1px}
.zoom button:hover{background:var(--grey-head)}

/* ---------- layout ---------- */
.wrap{max-width:1620px;margin:16px auto 44px;padding:0 22px;display:grid;gap:16px;
  grid-template-columns:minmax(0,1fr) 320px;align-items:start}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}}

/* ---------- table ---------- */
.tablebox{background:var(--white);border:1px solid var(--line);overflow:auto;max-height:74vh}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px}
th,td{border-bottom:1px solid var(--line);padding:0;text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;z-index:3;background:var(--grey-head);
  font-size:10.5px;font-weight:700;color:var(--ink-2);line-height:1.25;
  padding:7px 8px;border-bottom:1px solid var(--line-2);white-space:pre-line;vertical-align:bottom}
thead th.num{text-align:right}
tbody td{font-size:12.5px}
tbody tr:hover{background:var(--hover)}
td.pad{padding:5px 8px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.c-nr{width:36px;color:var(--ink-3);font-size:11px;text-align:right;padding-right:8px}
.c-prod{width:156px}
.c-desc{max-width:420px}
.c-ct{width:34px;text-align:center;font-family:"Consolas",ui-monospace,Menlo,monospace;font-size:11px}
.c-cm{width:148px}
.c-act{width:112px;white-space:nowrap;padding-right:6px}
.desc{font-size:11.5px;color:var(--ink-2);line-height:1.34;padding:5px 8px;white-space:pre-line}
td.c-desc{vertical-align:top}
body.nodesc .c-desc,body.nodesc #thead th:nth-child(3){display:none}
body.nodesc .tablebox table{min-width:860px}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* ---------- tabs ---------- */
.tabs{background:var(--white);border-bottom:1px solid var(--line)}
.tabs .inner{max-width:1620px;margin:0 auto;padding:0 22px;display:flex;gap:4px}
.tab{border:none;background:none;padding:11px 16px;font-size:13px;font-weight:600;
  color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab:hover{background:var(--grey-head)}
.tab.on{color:var(--bx-txt);border-bottom-color:var(--bx-txt)}
.page{display:none}
.page.on{display:block}
.wrap2{max-width:1620px;margin:16px auto 44px;padding:0 22px}

/* ---------- catalogue ---------- */
.catbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;
  border-bottom:1px solid var(--line)}
.catbar input{flex:1;min-width:220px;border:1px solid var(--line-2);padding:7px 9px}
.catbar input:focus{border-color:var(--focus)}
.catbar .hits{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grp{border-bottom:1px solid var(--line)}
.grp>summary{padding:8px 12px;cursor:pointer;font-weight:700;font-size:12.5px;
  display:flex;gap:10px;align-items:center;list-style:none;background:var(--soft)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::before{content:"▸";color:var(--bx-txt);font-size:11px}
.grp[open]>summary::before{content:"▾"}
.grp>summary:hover{background:var(--grey-head)}
.grp>summary .n{margin-left:auto;font-weight:400;color:var(--ink-3);font-variant-numeric:tabular-nums}
table.cat{width:100%;min-width:0;font-size:12px}
table.cat th{background:var(--grey-head);font-size:10.5px;padding:5px 8px;
  border-bottom:1px solid var(--line-2);position:static}
table.cat td{padding:5px 8px;border-bottom:1px solid var(--row-line);vertical-align:top}
table.cat td.a{font-weight:700;white-space:nowrap;width:120px}
table.cat td.n{text-align:right;font-variant-numeric:tabular-nums;width:66px}
table.cat td.c{text-align:center;font-family:"Consolas",monospace;width:32px}
table.cat td.act{width:34px;text-align:right}
table.cat .d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;white-space:pre-line;color:var(--ink-2);cursor:pointer}
table.cat .d.full{display:block;-webkit-line-clamp:unset}
.tagcu{background:var(--bx);color:#fff;font-size:9px;padding:1px 4px;margin-left:6px;font-weight:700}
.addbtn{border:1px solid var(--line-2);background:var(--input-bg);width:24px;height:22px;
  line-height:1;font-size:14px;color:var(--ink-2);padding:0}
.addbtn:hover{border-color:var(--bx-txt);color:var(--bx-txt)}

/* ---------- custom article form ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 16px}
.form .f{display:flex;flex-direction:column;gap:3px}
.form .f.wide{grid-column:1/-1}
.form label{font-size:11px;color:var(--ink-2);font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--line-2);padding:6px 8px;background:var(--input-bg)}
.form textarea{height:64px;resize:vertical;font-family:inherit}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--focus)}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatches button{width:28px;height:26px;border:1px solid var(--line-2);padding:0}
.swatches button.sel{outline:2px solid var(--ink);outline-offset:1px}
.swatches button.auto{width:auto;padding:0 9px;font-size:11px;background:var(--input-bg);color:var(--ink-2)}
.cts{display:flex;gap:8px}
.cts .ct{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.cts .ct span{font-size:12px;font-weight:700;color:var(--ink-2);flex:none;
  min-width:22px;text-align:center;background:var(--grey-head);border:1px solid var(--line);
  padding:5px 0;line-height:1.15}
.cts select{flex:1;min-width:0}
.hint{font-size:11.5px;color:var(--ink-3);margin:8px 0 0}
.err-msg{color:var(--bx-txt);font-size:12px;font-weight:600;min-height:16px;margin-top:8px}
.formfoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.edgrid{grid-template-columns:1fr}}
.edlist{max-height:430px;overflow:auto}
.edrow{display:flex;gap:10px;padding:6px 12px;border-bottom:1px solid var(--row-line);cursor:pointer;align-items:baseline}
.edrow:hover{background:var(--hover)}
.edrow.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--bx-txt)}
.edrow b{min-width:106px;font-size:12.5px;flex:none}
.edrow i{font-style:normal;color:var(--ink-3);font-size:11px;flex:1;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.edrow em{font-style:normal;font-size:10px;color:var(--ink-3);flex:none}
.grow{display:flex;gap:10px;align-items:center;padding:4px 12px;border-bottom:1px solid var(--row-line)}
.grow input{width:190px;border:1px solid transparent;padding:4px 6px;background:transparent;
  font-weight:700;font-size:12.5px}
.grow input:hover{border-color:var(--line);background:var(--input-bg)}
.grow input:focus{border-color:var(--focus);background:var(--input-bg)}
.grow .n{margin-left:auto;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.verbox{display:flex;gap:6px;align-items:center;margin-left:auto}
.verbox input{width:66px;border:1px solid var(--line-2);padding:6px 8px;text-align:center}
.verbox label{font-size:11.5px;color:var(--ink-2)}
.cellin{width:100%;border:0;background:transparent;padding:6px 8px}
.cellin:focus{background:var(--focus-bg);outline:2px solid var(--focus);outline-offset:-2px}
.c-prod .cellin{font-weight:600}
.supply{color:var(--blue);font-weight:700}
.shade{background:var(--shade);font-weight:700}
.bad{background:var(--red-soft);color:var(--bx-txt);font-weight:700}
.bad-ct{background:var(--red-soft);color:var(--bx-txt)}
tr.divrow td{background:var(--div-bg);border-top:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3)}
tr.divrow.bad td{background:var(--red-soft)}
tr.divrow:hover td{background:var(--div-bg2)}
tr.divrow.bad:hover td{background:var(--red-soft)}
.divcell{display:flex;gap:10px;align-items:center;padding:5px 8px}
.divcell select{border:1px solid var(--line-2);padding:4px 6px;font-size:12px;background:var(--input-bg)}
.divcell input{flex:1;max-width:300px;border:1px solid var(--line-2);padding:4px 7px;
  font-size:12.5px;font-weight:700;background:var(--input-bg)}
.divcell .sum{margin-left:auto;font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.railgrp{margin-bottom:6px}
.railgrp+.railgrp{border-top:1px solid var(--line);padding-top:10px}
.rg-head{display:flex;gap:9px;align-items:baseline;padding:0 0 4px 2px}
.rg-head .rg-k{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--white);
  background:var(--ink-2);padding:1px 5px}
.rg-head b{font-size:12.5px}
.rg-empty{font-size:12px;color:var(--ink-3);padding:14px 4px}
.rg-name{border:1px solid transparent;background:transparent;color:var(--ink);
  font-weight:700;font-size:12.5px;padding:2px 6px;min-width:150px;max-width:280px}
.rg-name::placeholder{color:var(--ink-2);font-weight:700}
.rg-name:hover{border-color:var(--line);background:var(--input-bg)}
.rg-name:focus{border-color:var(--focus);background:var(--input-bg);outline:none}
tr.addrow td{padding:8px;background:var(--soft);border-bottom:none}
tr.addrow .btn{font-size:12px;padding:5px 11px;margin-right:6px}
tr.addrow .startmsg{font-size:12px;color:var(--ink-2)}
tr.addrow:hover td{background:var(--soft)}
.divcell .rg-k{font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--white);
  background:var(--ink-2);padding:2px 6px;flex:none}
.rg-head .rg-n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rowact{display:flex;gap:2px}
.iconbtn{border:1px solid transparent;background:none;width:22px;height:22px;
  color:var(--ink-3);font-size:13px;line-height:1;padding:0}
tr:hover .iconbtn{color:var(--ink-2);border-color:var(--line)}
.iconbtn:hover{background:var(--grey-head);color:var(--ink)}
.iconbtn.del:hover{background:var(--red-soft);color:var(--bx-txt);border-color:#E9BDBD}

/* ---------- combobox ---------- */
.cb{position:relative}
.cb-list{background:var(--white);position:absolute;z-index:20;top:100%;left:0;width:410px;max-width:74vw;max-height:290px;
  overflow:auto;background:var(--white);border:1px solid var(--line-2);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.cb-item{padding:5px 9px;border-bottom:1px solid var(--row-line);cursor:pointer;display:flex;gap:9px;align-items:baseline}
.cb-item:last-child{border-bottom:none}
.cb-item.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--bx-txt)}
.cb-item b{font-weight:700;flex:none;min-width:96px;font-size:12.5px}
.cb-item i{font-style:normal;color:var(--ink-3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-item em{font-style:normal;color:var(--ink-3);font-size:11px;flex:none;font-variant-numeric:tabular-nums}
.cb-empty{padding:8px 9px;color:var(--ink-3);font-size:12px}

/* ---------- side panel ---------- */
.panel{display:flex;flex-direction:column;gap:16px;position:sticky;top:14px}
.card{background:var(--white);border:1px solid var(--line)}
.card h2{margin:0;padding:9px 12px;font-size:11.5px;font-weight:700;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:var(--grey-head)}
.card .body{padding:10px 12px}
.count{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:400}
.status{display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:12.5px}
.dot{width:10px;height:10px;flex:none}
.ok .dot{background:var(--green)}
.status.err .dot{background:var(--bx-txt)}
.status.err{color:var(--bx-txt);font-weight:700}
.issues{list-style:none;margin:0;padding:0;max-height:250px;overflow:auto}
.issues li{padding:7px 12px;border-bottom:1px solid var(--row-line);font-size:11.8px;display:flex;gap:8px;cursor:pointer}
.issues li:last-child{border-bottom:none}
.issues li:hover{background:var(--hover)}
.issues b{flex:none;color:var(--bx-txt);font-variant-numeric:tabular-nums;font-weight:700;min-width:24px}
dl.stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12.5px}
dl.stats dt{color:var(--ink-2)}
dl.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
dl.stats dd.neg{color:var(--bx)}
table.bom{width:100%;min-width:0;font-size:12px}
table.bom td{padding:4px 12px;border-bottom:1px solid var(--row-line)}
table.bom td:last-child{text-align:right;font-variant-numeric:tabular-nums;width:34px;color:var(--ink-2)}
.legend{font-size:11.5px;color:var(--ink-2)}
.legend div{display:flex;gap:9px;padding:2px 0;align-items:baseline}
.legend code{font-family:"Consolas",ui-monospace,Menlo,monospace;flex:none;min-width:30px;color:var(--ink)}
.legend .sw{width:13px;height:13px;border:1px solid var(--line-2);flex:none;position:relative;top:2px}
.note{font-size:11px;color:var(--ink-2);padding:10px 12px;border-top:1px solid var(--line);background:var(--soft)}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line-2);border-radius:0;padding:0;max-width:540px;width:92vw;
  box-shadow:0 16px 44px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h2{margin:0;padding:11px 16px;font-size:13.5px;font-weight:700;
  border-bottom:3px solid var(--bx)}
dialog .body{padding:14px 16px}
dialog textarea{width:100%;height:190px;border:1px solid var(--line-2);padding:8px;
  font-family:"Consolas",ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical}
dialog p{margin:0 0 10px;font-size:12.5px;color:var(--ink-2)}
dialog .foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.radios{display:flex;gap:18px;margin-bottom:12px;font-size:12.5px}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}

/* ---------- print / PDF ---------- */
@media print{
  body{background:#fff}
  body.dark{--ink-3:#8C8C8C;--line-2:#9C9C9C}
  body > *{display:none !important}
  #print-report{display:block !important}
}
#print-report{font-size:8.6pt;color:#1A1A1A;line-height:1.35;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
#print-report *{box-sizing:border-box}

#print-report .rep-head{break-inside:avoid;display:flex;align-items:flex-start;gap:18px;padding-bottom:9px}
#print-report .rep-head img{height:34px;flex:none}
#print-report .rep-title{font-size:15pt;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.1}
#print-report .rep-sub{font-size:8.5pt;color:#666;margin:3px 0 0;letter-spacing:.06em;
  text-transform:uppercase}
#print-report .rep-meta{margin-left:auto;text-align:right;font-size:8pt;color:#555;line-height:1.55}
#print-report .rep-meta b{display:block;font-size:12pt;color:#1A1A1A;line-height:1.2}
#print-report .rule{height:3px;background:#CC0000;margin-bottom:11px}

#print-report .rep-status{break-inside:avoid;padding:6px 10px;font-weight:700;font-size:9.5pt;margin-bottom:13px;
  border-left:4px solid #2E7D32;background:#F0F6F0;color:#23611F}
#print-report .rep-status.bad{border-left-color:#B00000;background:#FBEFEF;color:#B00000}

#print-report .kpi{display:flex;gap:0;margin-bottom:16px;border:1px solid #D8D8D8;
  break-inside:avoid;page-break-inside:avoid}
#print-report .kpi > div{flex:1;padding:7px 10px;border-right:1px solid #E4E4E4}
#print-report .kpi > div:last-child{border-right:none}
#print-report .kpi span{display:block;font-size:7pt;color:#666;letter-spacing:.05em;
  text-transform:uppercase;margin-bottom:1px}
#print-report .kpi b{font-size:12pt;font-weight:700;font-variant-numeric:tabular-nums}
#print-report .kpi b.neg{color:#B00000}

#print-report h3{break-after:avoid;page-break-after:avoid;font-size:9pt;font-weight:700;margin:16px 0 6px;letter-spacing:.06em;
  text-transform:uppercase;color:#444;border-bottom:1px solid #CFCFCF;padding-bottom:3px}
#print-report h3:first-of-type{margin-top:0}

#print-report table{width:100%;min-width:0;border-collapse:collapse;font-size:7.8pt}
#print-report thead{display:table-header-group}
#print-report th{text-align:left;font-weight:700;padding:3px 5px;color:#333;
  border-bottom:1px solid #8A8A8A;white-space:nowrap;vertical-align:bottom}
#print-report thead tr:first-child th{font-size:7.4pt;color:#666;letter-spacing:.04em;
  text-transform:uppercase;border-bottom:1px solid #DDD;padding-bottom:2px}
#print-report th.n,#print-report td.n{text-align:right;font-variant-numeric:tabular-nums}
#print-report th.c,#print-report td.c{text-align:center}
#print-report th.grp{text-align:center;border-left:1px solid #DDD;border-right:1px solid #DDD}
#print-report td{padding:2.6px 5px;border-bottom:.4pt solid #DEDEDE;vertical-align:top}
#print-report tbody tr:nth-child(even) td{background:#FAFAFA}
#print-report tr{break-inside:avoid;page-break-inside:avoid}
#print-report .sec{break-inside:avoid;page-break-inside:avoid}
#print-report table{orphans:3;widows:3}
#print-report ol.errs li,#print-report ul.parts li{page-break-inside:avoid}
#print-report .rep-foot{break-inside:avoid}
#print-report td.bad{background:#F7DCDC;color:#A50000;font-weight:700}
#print-report td.sh{background:#ECECEC;font-weight:700}
#print-report td.art{font-weight:700;white-space:nowrap}
#print-report td.dsc{color:#555}
#print-report tr.divr td{background:#E6E6E6;border-top:1.2px solid #8A8A8A;
  border-bottom:1.2px solid #8A8A8A;font-size:8pt;padding:3.5px 5px}
#print-report tr.divr td b{letter-spacing:.03em}
#print-report tr.divr .warn{color:#B00000;font-weight:700}

#print-report .rep-strip{break-inside:avoid;page-break-inside:avoid;margin-bottom:10px}
#print-report .rep-rg{font-size:7.6pt;color:#555;margin-bottom:2px;letter-spacing:.04em}
#print-report .rep-rg b{color:#1A1A1A;font-size:8.4pt;letter-spacing:0}
#print-report .rep-strip svg{max-width:100%;height:auto}

#print-report ol.errs{margin:0;padding:0;list-style:none}
#print-report ol.errs li{padding:3px 8px;margin-bottom:2px;background:#FBEFEF;
  border-left:3px solid #B00000;break-inside:avoid}
#print-report ol.errs li b{color:#B00000;margin-right:6px}
#print-report ul.parts{margin:0;padding:0;list-style:none;column-count:4;column-gap:16px}
#print-report ul.parts li{display:flex;gap:8px;font-size:7.8pt;padding:1.6px 0;
  border-bottom:.4pt solid #E4E4E4;break-inside:avoid}
#print-report ul.parts li span{margin-left:auto;font-variant-numeric:tabular-nums;color:#555}
#print-report .rep-foot{margin-top:16px;padding-top:6px;border-top:1px solid #CFCFCF;
  font-size:7pt;color:#666}
</style>
</head>
<body>

<header class="topbar">
  <div class="inner">
    <div class="brand">
      <button class="logo" id="logo" title=""><span id="logo-txt">Logotyp</span></button>
      <h1 id="h-title">K-bus / E-bus konfigurationskontroll</h1>
      <span class="ver" id="ver">v1.9</span>
      <button class="themebtn" id="b-theme" title="">☾</button>
    </div>
    <div class="head-fields">
      <div class="field"><label for="proj" id="l-proj">Projekt</label><input id="proj" value=""></div>
      <div class="field"><label for="lang" id="l-lang">Språk</label>
        <select id="lang">
          <option value="sv">Svenska</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
    </div>
  </div>
</header>

<div class="toolbar"><div class="inner">
  <button class="btn primary" id="b-add">+ Rad</button>
  <button class="btn" id="b-div">+ Avdelare</button>
  <button class="btn" id="b-paste">Klistra in lista</button>
  <button class="btn" id="b-example">Exempel</button>
  <button class="btn" id="b-clear">Töm</button>
  <button class="btn" id="b-desc">Dölj beskrivningar</button>
  <span class="spacer"></span>
  <button class="btn" id="b-open">Öppna…</button>
  <button class="btn" id="b-save">Spara .json</button>
  <button class="btn" id="b-csv">Exportera .csv</button>
  <button class="btn" id="b-pdf">Exportera PDF</button>
  <input type="file" id="file" accept=".json,application/json" hidden>
  <input type="file" id="logofile" accept="image/*" hidden>
</div></div>

<nav class="tabs"><div class="inner">
  <button class="tab on" id="t-conf" data-pg="pg-conf">Konfiguration</button>
  <button class="tab" id="t-cat" data-pg="pg-cat">Artikelkatalog</button>
  <button class="tab" id="t-add" data-pg="pg-add">Redigera artiklar</button>
</div></nav>

<div class="page on" id="pg-conf">
<section class="railview">
  <div class="railview-inner">
    <div class="rv-head">
      <div class="rv-title" id="l-rail">Skenvy</div>
      <div class="zoom">
        <button id="z-out" title="−">−</button>
        <button id="z-in" title="+">+</button>
      </div>
      <div class="rv-stats" id="rv-stats"></div>
    </div>
    <div class="strip" id="strip"></div>
  </div>
</section>

<main class="wrap">
  <div class="tablebox">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <aside class="panel">
    <div class="card">
      <h2 id="l-check">Kontroll<span class="count" id="issue-count"></span></h2>
      <div class="status ok" id="status"><span class="dot"></span><span id="status-text"></span></div>
      <ul class="issues" id="issues"></ul>
    </div>

    <div class="card">
      <h2 id="l-sum">Summering</h2>
      <div class="body"><dl class="stats" id="stats"></dl></div>
    </div>

    <div class="card">
      <h2 id="l-bom">Artikellista<span class="count" id="bom-count"></span></h2>
      <table class="bom"><tbody id="bom"></tbody></table>
    </div>

    <div class="card legend-card">
      <h2 id="l-leg">Teckenförklaring</h2>
      <div class="body legend" id="legend"></div>
      <div class="note" id="l-note"></div>
    </div>
  </aside>
</main>
</div>

<div class="page" id="pg-cat">
  <div class="wrap2"><div class="card">
    <h2 id="l-cat">Artikelkatalog<span class="count" id="cat-count"></span></h2>
    <div class="catbar">
      <input id="cat-q" spellcheck="false" autocomplete="off">
      <span class="hits" id="cat-hits"></span>
      <button class="btn" id="cat-collapse">−</button>
    </div>
    <div id="cat-list"></div>
  </div></div>
</div>

<div class="page" id="pg-add">
  <div class="wrap2">
    <div class="edgrid">
      <div class="card">
        <h2 id="l-new">Ny artikel</h2>
        <div class="body">
          <div class="form">
            <div class="f"><label id="f1">Artikelnummer</label><input id="a-art" spellcheck="false"></div>
            <div class="f"><label id="f8">Grupp</label><select id="a-g"></select></div>
            <div class="f"><label id="f2">Bredd (mm)</label><input id="a-w" type="number" min="0" step="1"></div>
            <div class="f"><label id="f3">E-bus ström (mA)</label><input id="a-e" type="number" step="1"></div>
            <div class="f"><label id="f4">K-bus ström (mA)</label><input id="a-k" type="number" step="1"></div>
            <div class="f wide"><label id="f9">Kortets färg</label>
            <div class="swatches" id="a-bg"></div></div>
          <div class="f wide"><label id="f10">Färg på topplisten (korttyp)</label>
            <div class="swatches" id="a-tc"></div></div>
          <div class="f wide"><label id="f7">Potentialkontakter</label>
              <div class="cts">
                <div class="ct"><span>+</span><select id="a-c0"></select></div>
                <div class="ct"><span>−</span><select id="a-c1"></select></div>
                <div class="ct"><span>PE</span><select id="a-c2"></select></div>
              </div>
            </div>
            <div class="f wide"><label id="f5">Beskrivning (engelska)</label><textarea id="a-de" spellcheck="false"></textarea></div>
            <div class="f wide"><label id="f6">Beskrivning (tyska)</label><textarea id="a-dd" spellcheck="false"></textarea></div>
          </div>
          <p class="hint" id="a-hint"></p>
          <div class="err-msg" id="a-err"></div>
        </div>
        <div class="formfoot">
          <button class="btn primary" id="a-add">Lägg till</button>
          <button class="btn" id="a-reset">Ny artikel</button>
          <button class="btn" id="a-del" hidden>Ta bort</button>
        </div>
      </div>

      <div class="card">
        <h2 id="l-find">Sök artikel<span class="count" id="find-count"></span></h2>
        <div class="catbar"><input id="ed-q" spellcheck="false" autocomplete="off"></div>
        <div id="ed-list" class="edlist"></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <h2 id="l-grp">Grupper<span class="count" id="grp-count"></span></h2>
      <div id="grp-list" class="edlist"></div>
      <div class="formfoot">
        <input id="grp-new" spellcheck="false" style="border:1px solid var(--line-2);padding:6px 8px;width:150px">
        <button class="btn" id="grp-add">Ny grupp</button>
        <span class="verbox">
          <span class="hint" id="exp-hint" style="margin:0"></span>
          <label for="newver" id="l-ver">Version</label>
          <input id="newver" value="2.0">
          <button class="btn primary" id="b-html">Spara ny HTML-fil</button>
        </span>
      </div>
    </div>
  </div>
</div>

<dialog id="dlg">
  <h2 id="dlg-title">Klistra in lista</h2>
  <div class="body">
    <p id="dlg-help"></p>
    <textarea id="dlg-text" spellcheck="false"></textarea>
  </div>
  <div class="foot">
    <button class="btn" id="dlg-cancel">Avbryt</button>
    <button class="btn primary" id="dlg-ok">Lägg till</button>
  </div>
</dialog>

<dialog id="pdlg">
  <h2 id="pdlg-title">Exportera PDF</h2>
  <div class="body">
    <p id="pdlg-help"></p>
    <div class="radios" id="pdlg-radios">
      <label><input type="radio" name="orient" value="landscape" checked><span id="pd-land">A4 liggande</span></label>
      <label><input type="radio" name="orient" value="portrait"><span id="pd-port">A4 stående</span></label>
    </div>
    <div class="radios">
      <label><input type="checkbox" id="pd-desc" checked><span id="pd-desc-l">Ta med produktbeskrivning</span></label>
    </div>
  </div>
  <div class="foot">
    <button class="btn" id="pdlg-cancel">Avbryt</button>
    <button class="btn primary" id="pdlg-ok">Öppna utskrift</button>
  </div>
</dialog>

<div id="print-report"></div>

let lang = "sv";
const t = () => T[lang];

/* ---------------- state ---------------- */
const EXAMPLE = [["CX8190","CPU / PLC"],["KL1404","Digital Inputs"],["KL2404","Digital Outputs"],
  ["KL3208-0010","Analog Inputs"],["KL4404","Analog Outputs"],["KL9010","End Terminal"]];
let firstRail = "";                 // only used when reading older project files
const newRail = (n) => ({d:1, k:"rail", n:n || ""});
let rows = [newRail()].concat(EXAMPLE.map(([p,c]) => ({p,c})));
while (rows.length < 11) rows.push({p:"",c:""});
const hasRail = () => rows.length > 0 && rows[0].d;
function ensureRail(){ if (!hasRail()) rows.unshift(newRail()); }

/* ---------------- Excel-compatible helpers ----------------
   In Excel an empty string sorts above every number, so ""&gt;0 is TRUE.
   The original workbook relies on that; these helpers reproduce it. */
const isNum = v => typeof v === "number";
const gt = (a,b) => (typeof a === "string") ? (typeof b === "string" ? a > b : true)
                                           : (typeof b === "string" ? false : a > b);

/* ---------------- computation ---------------- */
function compute(){
  const r = rows.map(row => {
    if (row.d) return {div:1, dk:row.k || "rail", n:row.n || "", p:"", c:"",
      item:null, missing:false, D:"", F:"", H:"", ct:["","",""], desc:"",
      msgs:[], ctBad:[false,false,false], bad:false};
    const item = row.p ? BY.get(row.p.trim()) : null;
    const missing = !!row.p.trim() && !item;
    return {
      p: row.p, c: row.c, item, missing,
      D: item && isNum(item.e) ? item.e : "",
      F: item && isNum(item.k) ? item.k : "",
      H: item && isNum(item.w) ? item.w : "",
      ct: item ? [item.a || "", item.b || "", item.c || ""] : ["","",""],
      desc: item ? (lang === "de" ? item.dd : item.de) : ""
    };
  });

  // running values — identical to columns E, G and I of the workbook
  for (let i = 0; i < r.length; i++){
    const pv = i ? r[i-1] : {E:"",G:"",H:"",I:""};
    if (r[i].div){                       // a rail break carries the bus budget, a station resets it
      r[i].E = pv.E;                     // the bus carries on through a rail extension
      r[i].G = pv.G;
      r[i].I = "";
      continue;
    }
    const {D,F,H} = r[i];
    r[i].E = (F !== "") ? D : (gt(D,0) ? D : (pv.E === "" ? D : pv.E + D));
    r[i].G = gt(F,0) ? F : (pv.G === "" ? F : pv.G + F);
    r[i].I = (H === "") ? "" : (pv.H === "" ? H : H + pv.I);
  }

  // conditional formatting + error list
  const E = t().e;
  for (let i = 0; i < r.length; i++){
    const cur = r[i], pv = i ? r[i-1] : null, nx = r[i+1] || {E:"",G:"",I:""};
    if (cur.div){                        // the rail above has to be terminated before a break
      let pm = null;
      for (let j = i - 1; j >= 0; j--){ if (r[j].div) break; if (r[j].item || r[j].missing){ pm = r[j]; break; } }
      cur.msgs = (pm && pm.ct[0] !== "---") ? [E.notTerm] : [];
      cur.bad = cur.msgs.length > 0;
      continue;
    }
    // after a divider the potential chain starts over
    const pct = pv ? (pv.div ? ["","",""] : pv.ct) : ["+","-","PE"];
    const pI  = pv ? pv.I : "";
    const pE  = pv ? pv.E : "", pG = pv ? pv.G : "";
    const msgs = new Set();

    cur.eBad = isNum(cur.E) && cur.E < 0;
    cur.gBad = isNum(cur.G) && cur.G < 0;
    cur.eShade = !cur.eBad && ((cur.E !== "" && nx.E === "" && pE !== "") || (gt(nx.E,cur.E) && pE !== ""));
    cur.gShade = !cur.gBad && ((cur.G !== "" && nx.G === "" && pG !== "") || (gt(nx.G,cur.G) && pG !== ""));
    cur.iShade = cur.I !== "" && nx.I === "";

    if (cur.missing) msgs.add(E.unknown);
    if (cur.eBad) msgs.add(E.eneg(cur.E));
    if (cur.gBad) msgs.add(E.kneg(cur.G));

    cur.ctBad = [false,false,false];
    for (let k = 0; k < 3; k++){
      const c = cur.ct[k], p = pct[k];
      let bad = false;
      if (c === "-T-" && p === "T"){ bad = true; msgs.add(E.startAfterSupply); }
      if (c === "|"   && p === ""){ bad = true; msgs.add(E.fwdNoSource); }
      if (c === "|"   && p === "==="){ bad = true; msgs.add(E.fwdAfterSep); }
      if (c === "===" && pI === ""){ bad = true; msgs.add(E.sepFirst); }
      if (p === "---" && (c === "T" || c === "---" || c === "===" || c === "|")){ bad = true; msgs.add(E.afterEnd); }
      if (p === "---" && c === "" && (cur.D !== "" || cur.F !== "")
          && !(k === 2 && cur.ct[0] === "-T-")){ bad = true; msgs.add(E.afterEnd); }
      cur.ctBad[k] = bad;
    }
    cur.msgs = [...msgs];
    cur.bad = cur.msgs.length > 0;
  }

  // ELX (Ex i) segment rules, per the Beckhoff ELX9xxx operating manual
  const flag = (m, s) => { if (!m.msgs.includes(s)){ m.msgs = m.msgs.concat(s); m.bad = true; } };
  const ex = m => { const n = (m.p || "").toUpperCase();
    return n.startsWith("ELX9560") ? "psu" : n.startsWith("ELX9410") ? "ext"
         : n.startsWith("ELX9012") ? "cap" : n.startsWith("ELX") ? "sig"
         : n.startsWith("EK1110") ? "ek" : "std"; };
  let inSeg = false, p1 = null, p2 = null, lastMod = null;
  const closeRail = () => { if (inSeg && lastMod) flag(lastMod, E.elxNotTerm);
                            inSeg = false; p1 = p2 = lastMod = null; };
  for (let i = 0; i < r.length; i++){
    const m = r[i];
    if (m.div){ closeRail(); continue; }
    if (!(m.item || m.missing)) continue;
    const c = ex(m), c1 = p1 ? ex(p1) : null;
    if (c === "sig"){
      if (!inSeg) flag(m, E.elxNoPsu);
      if (c1 === "ext") flag(m, E.elxExtPos);
    }
    if (c === "psu"){
      if (inSeg && c1 !== "ext") flag(m, E.elx2ndPsu);
      inSeg = true;
    }
    if (c === "ext" && c1 === "psu") flag(m, E.elxExtPos);
    if (c === "cap" || c === "ek" || (c === "ext" && c1 === "ext")) inSeg = false;
    if (c === "std" && inSeg){ flag(m, E.elxNotTerm); inSeg = false; }
    p2 = p1; p1 = m; lastMod = m;
  }
  closeRail();

  for (let i = r.length - 1; i >= 0; i--){          // the last rail needs an end terminal too
    if (r[i].div) break;
    if (r[i].item || r[i].missing){
      if (r[i].ct[0] !== "---"){ r[i].msgs = r[i].msgs.concat(E.noEnd); r[i].bad = true; }
      break;
    }
  }
  return r;
}

/* ---------------- rail / station grouping ---------------- */
function groupsOf(r){
  const d = t().d, gs = [];
  let cur = {label:firstRail, kind:"rail", mods:[], at:-1};
  const push = () => { cur.total = cur.mods.reduce((s,x) => s + (isNum(x.H) ? x.H : 0), 0); gs.push(cur); };
  for (let i = 0; i < r.length; i++){
    const x = r[i];
    if (x.div){ push(); cur = {label:x.n, kind:"rail", mods:[], at:i}; }
    else if (x.item || x.missing) cur.mods.push(x);
  }
  push();
  let nr = 0;
  for (const g of gs){
    if (g.at < 0 && !g.mods.length) continue;      // phantom group before the first rail
    nr++;
    g.name = g.label;
    if (!g.label) g.label = String(nr);
    if (g.at >= 0){
      r[g.at].sum = g.mods.length + " " + (g.mods.length === 1 ? d.mods1 : d.mods) + " · " + g.total + " mm";
      r[g.at].label0 = g.label;
    }
  }
  return gs;
}

/* ---------------- rendering ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = v => v === "" ? "" : String(v);

function render(){        // full rebuild — after structural changes
  const r0 = compute(); groupsOf(r0); renderTable(r0);
  refresh();
}
function refresh(){       // recompute derived cells in place, keeping focus/caret
  const r = compute();
  groupsOf(r);
  const trs = $("tbody").children;
  for (let i = 0; i < r.length; i++) if (trs[i]) patchRow(trs[i], r[i]);
  renderRail(r);
  renderPanel(r);
}
function patchRow(tr, x){
  if (x.div){
    tr.classList.toggle("bad", !!x.bad);
    const s = tr.querySelector(".sum");
    if (s) s.textContent = x.sum || "";
    return;
  }
  if (tr.classList.contains("divrow")) return;
  const c = tr.children;
  const d = c[2].firstElementChild;
  d.innerHTML = x.missing ? `<span style="color:var(--bx-txt)">${esc(t().e.unknown)}</span>` : esc(x.desc);
  d.title = x.missing ? t().e.unknown : x.desc;
  const set = (n, v, cls) => { c[n].textContent = fmt(v); c[n].className = cls; };
  set(3, x.D, "pad num" + (isNum(x.D) && x.D > 0 ? " supply" : ""));
  set(4, x.E, "pad num" + (x.eBad ? " bad" : x.eShade ? " shade" : ""));
  set(5, x.F, "pad num" + (isNum(x.F) && x.F > 0 ? " supply" : ""));
  set(6, x.G, "pad num" + (x.gBad ? " bad" : x.gShade ? " shade" : ""));
  set(7, x.H, "pad num");
  set(8, x.I, "pad num" + (x.iShade ? " shade" : ""));
  for (let k = 0; k < 3; k++) set(9 + k, x.ct[k], "c-ct" + (x.ctBad[k] ? " bad-ct" : ""));
}

function renderTable(r){
  const th = t().th;
  $("thead").innerHTML = th.map((h,i) =>
    `<th class="${i>=3&&i<=8?'num':''} ${i===0?'c-nr':''}">${esc(h)}</th>`).join("");

  const a = t().act, dt = t().d;
  $("tbody").innerHTML = r.map((x,i) => {
    if (x.div) return `<tr class="divrow${x.bad ? " bad" : ""}" data-i="${i}">
      <td class="c-nr"></td>
      <td colspan="12"><div class="divcell">
        <span class="rg-k">${esc(dt.railN)}</span>
        <input class="dname" value="${esc(x.n)}" placeholder="${esc(dt.name)}" spellcheck="false">
        <span class="sum"></span>
      </div></td>
      <td class="c-act"><div class="rowact">
        <button class="iconbtn up" title="${esc(a.up)}">↑</button>
        <button class="iconbtn dn" title="${esc(a.dn)}">↓</button>
        <button class="iconbtn ins" title="${esc(a.ins)}">⤒</button>
        <button class="iconbtn dup" title="${esc(a.dup)}">⧉</button>
        <button class="iconbtn del" title="${esc(a.del)}">✕</button>
      </div></td></tr>`;
    const cls = (v,bad,sh) => "pad num" + (bad ? " bad" : sh ? " shade" : "");
    const ctd = k => `<td class="c-ct${x.ctBad[k] ? " bad-ct" : ""}">${esc(x.ct[k])}</td>`;
    return `<tr data-i="${i}">
      <td class="c-nr">${i+1}</td>
      <td class="c-prod"><div class="cb"><input class="cellin p" value="${esc(x.p)}"
        placeholder="${esc(t().searchPh)}" autocomplete="off" spellcheck="false"
        aria-label="${esc(t().th[1])} ${i+1}"></div></td>
      <td class="c-desc"><div class="desc" title="${esc(x.missing ? t().e.unknown : x.desc)}">${
        x.missing ? `<span style="color:var(--bx-txt)">${esc(t().e.unknown)}</span>` : esc(x.desc)}</div></td>
      <td class="pad num${isNum(x.D) && x.D > 0 ? " supply" : ""}">${fmt(x.D)}</td>
      <td class="${cls(x.E,x.eBad,x.eShade)}">${fmt(x.E)}</td>
      <td class="pad num${isNum(x.F) && x.F > 0 ? " supply" : ""}">${fmt(x.F)}</td>
      <td class="${cls(x.G,x.gBad,x.gShade)}">${fmt(x.G)}</td>
      <td class="pad num">${fmt(x.H)}</td>
      <td class="pad num${x.iShade ? " shade" : ""}">${fmt(x.I)}</td>
      ${ctd(0)}${ctd(1)}${ctd(2)}
      <td class="c-cm"><input class="cellin c" value="${esc(x.c)}" spellcheck="false" aria-label="${esc(t().th[12])} ${i+1}"></td>
      <td class="c-act"><div class="rowact">
        <button class="iconbtn up" title="${esc(a.up)}" aria-label="${esc(a.up)}">↑</button>
        <button class="iconbtn dn" title="${esc(a.dn)}" aria-label="${esc(a.dn)}">↓</button>
        <button class="iconbtn ins" title="${esc(a.ins)}" aria-label="${esc(a.ins)}">⤒</button>
        <button class="iconbtn dup" title="${esc(a.dup)}" aria-label="${esc(a.dup)}">⧉</button>
        <button class="iconbtn del" title="${esc(a.del)}" aria-label="${esc(a.del)}">✕</button>
      </div></td></tr>`;
  }).join("") + `<tr class="addrow"><td colspan="14">
      ${rows.length ? `<button class="btn ra">${esc(t().add)}</button>` : ""}
      <button class="btn${rows.length ? "" : " primary"} rd">${esc(t().d.addDiv)}</button>
      ${rows.length ? "" : `<span class="startmsg">${esc(t().d.start)}</span>`}</td></tr>`;
}

let zoom = 1;
const HW = {
  body:"#FFFFFF", edge:"#3A3A3A", shade:"#EFEFEF",
  ink:"#1A1A1A", sub:"#555555",
  panel:"#26292C", metal:"#E4E4E4", pinGold:"#C8A23A",
  pin:"#FFFFFF", pinEdge:"#4A4A4A",
  latch:"#E8791C", bx:"#CC0000", brass:"#C8A32B",
  rail1:"#EDEDED", rail2:"#C9C9C9", rail3:"#A2A2A2",
  led:"#33B24A", ledY:"#E8C21C",
  plus:"#D42A20", minus:"#1E63C8", pe:"#B5B22E"
};
/* branch-standard signal colours, used for the strip on top of every card */
const TYPE_COL = {di:"#F2C200", do:"#D42A20", ai:"#2FA34A", ao:"#1E63C8", com:"#E8791C",
                  pos:"#159B96", drv:"#7A4FBF", spc:"#8E9499", sys:"#D5D8DA", sys9:"#E8791C", safe:"#F2C200"};
const PALETTE = ["#F2C200","#D42A20","#1E63C8","#2FA34A","#E8791C","#7A4FBF","#159B96",
                 "#8E9499","#FFFFFF","#2B2B2B"];
const MH = 164;

function kindOf(x){
  const n = (x.p || "").toUpperCase(), w = isNum(x.H) ? x.H : 12;
  const src = (isNum(x.D) && x.D > 0) || (isNum(x.F) && x.F > 0);
  if (/^(CX|C6|C7|CP)/.test(n) || w >= 60) return "ipc";
  if (src && w >= 28) return "coupler";
  if (src) return "psu";
  if (x.ct[0] === "---") return "end";
  if (x.ct[0] === "===") return "sep";
  return "term";
}
function channels(x){
  const m = (x.desc || "").match(/(\d+)\s*-?\s*(channel|kanal|Kanal)/);
  return Math.max(1, Math.min(8, m ? +m[1] : 2));
}
function family(x){
  const m = (x.p || "").toUpperCase().match(/^[A-Z]{2,3}(\d)/);
  return m ? +m[1] : 0;
}
function cardType(x){
  const d = x.desc || "";
  if (/twinsafe/i.test(d) && !/twinsafe\s*sc/i.test(d)) return "safe";
  if (/^KL90/i.test(x.p || "")) return "sys9";      // bus end, extension, shield, isolation
  const k = kindOf(x);
  if (k === "ipc" || k === "coupler") return "sys";
  return {1:"di",2:"do",3:"ai",4:"ao",5:"pos",6:"com",7:"drv",8:"spc",9:"sys"}[family(x)] || "sys";
}
const isElx = x => /^ELX/i.test(x.p || "");
const lum = c => { const m = /^#?([0-9a-fA-F]{6})$/.exec(c || ""); if (!m) return 1;
  const n = parseInt(m[1],16);
  return (0.299*((n>>16)&255) + 0.587*((n>>8)&255) + 0.114*(n&255)) / 255; };
const topColour  = x => (x.item && x.item.tc) || TYPE_COL[cardType(x)] || TYPE_COL.sys;
const bodyColour = x => (x.item && x.item.bg) ||
  (isElx(x) ? "#2E62A8" : cardType(x) === "safe" ? TYPE_COL.safe : HW.body);

const r2 = v => Math.round(v * 10) / 10;
const R = (x,y,w,h,f,s,rx) => `<rect x="${r2(x)}" y="${r2(y)}" width="${r2(Math.max(0,w))}" height="${r2(Math.max(0,h))}"`+
  (rx ? ` rx="${rx}"` : "") + ` fill="${f}"` + (s ? ` stroke="${s}" stroke-width=".9"` : "") + `/>`;
const TXT = (x,y,s,size,fill,anchor,extra) =>
  `<text x="${r2(x)}" y="${r2(y)}" font-size="${r2(size)}" fill="${fill}"`+
  (anchor ? ` text-anchor="${anchor}"` : "") + (extra || "") + `>${esc(s)}</text>`;
const VTXT = (x,y,s,size,fill,extra) =>
  `<text x="${r2(x)}" y="${r2(y)}" transform="rotate(-90 ${r2(x)} ${r2(y)})" font-size="${r2(size)}"`+
  ` fill="${fill}"${extra || ""}>${esc(s)}</text>`;

/* one connection level: wire entry above, contact point below */
function level(cx, ly, cw, lh, fillCol, label, dark, broken){
  const sw = Math.min(11, cw * .46), r = Math.min(4.4, cw * .19);
  let s = R(cx - sw / 2, ly, sw, sw, fillCol, HW.pinEdge, 1);
  if (label) s += TXT(cx, ly + sw * .78, label, Math.min(sw * .72, sw * 1.6 / label.length),
                      dark ? HW.ink : "#FFFFFF", "middle", ' font-weight="700"');
  if (broken) s += `<path d="M${r2(cx - sw/2)} ${r2(ly + sw)} L${r2(cx + sw/2)} ${r2(ly)}"
    stroke="${HW.bx}" stroke-width="1.4"/>`;
  const cy = ly + sw + 3 + r;
  s += `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r)}" fill="${HW.pin}" stroke="${HW.pinEdge}" stroke-width=".9"/>`;
  s += `<circle cx="${r2(cx)}" cy="${r2(cy)}" r="${r2(r * .42)}" fill="#B8B8B8"/>`;
  return s;
}
function rj45(x, y, w, h){
  let s = R(x, y, w, h, HW.metal, HW.edge, 1);
  s += R(x + w * .18, y + 2.5, w * .64, h * .5, HW.panel, null, .6);
  for (let i = 0; i < 6; i++) s += R(x + w * .22 + i * (w * .58 / 6), y + 3, w * .05, h * .34, HW.pinGold);
  s += R(x + w * .34, y + h - 4.5, w * .32, 4.5, HW.metal, HW.edge, .6);
  s += R(x + 1.6, y + 1.6, 3.4, 3.4, HW.ledY, "#8A7414", .5);
  return s;
}
function usb(x, y, w, h){
  return R(x, y, w, h, HW.metal, HW.edge, 1) + R(x + 1.6, y + h * .34, w - 3.2, h * .34, HW.panel);
}
function ledBox(x, y, w, h, labels, on){
  let s = R(x, y, w, h, "#FFFFFF", HW.edge, 1);
  const step = h / (labels.length + .3);
  labels.forEach((lb,i) => {
    const ly = y + step * (i + .55);
    s += TXT(x + 3, ly + 2, lb, Math.min(4.8, w * .17), HW.sub);
    s += R(x + w - 9, ly - 3.4, 6.8, 6.8, i < (on || 1) ? HW.led : "#F0F0F0", HW.pinEdge, .8);
  });
  return s;
}
function grille(x, y, w, h){
  let s = R(x, y, w, h, "#FFFFFF", HW.edge, 1);
  const n = Math.max(4, Math.floor(w / 4));
  for (let i = 0; i < n; i++) s += R(x + 2 + i * ((w - 4) / n), y + 2, (w - 4) / n * .5, h - 4, "#1E1E1E");
  return s;
}
function beckhoffStrip(x, y, w, h, name){
  let s = R(x, y, w, h, HW.bx, null, 1);
  s += VTXT(x + w * .40, y + h - 6, "BECKHOFF", Math.min(9.5, w * .38), "#FFFFFF",
            ' font-weight="700" letter-spacing=".5"');
  s += VTXT(x + w * .82, y + h - 6, name, Math.min(8, w * .3), "#FFFFFF");
  return s;
}
function foot(x, W, y, name, dark){
  const fs = Math.max(3.4, Math.min(7, (W - 4) / Math.max(5, name.length) * 1.85));
  let s = TXT(x + W / 2, y + fs, name, fs, dark ? "#FFFFFF" : HW.ink, "middle");
  if (W > 26) s += TXT(x + W / 2, y + fs + 6, "BECKHOFF", Math.min(4.4, W / 9),
    dark ? "rgba(255,255,255,.8)" : HW.sub, "middle",
                       ' letter-spacing=".2"');
  return s;
}

function drawModule(x, W, m){
  const k = kindOf(m), ch = channels(m), ty = cardType(m);
  const bg = bodyColour(m), tc = topColour(m);
  let g = `<g class="mod${m.bad ? " err" : ""}"><title>${esc(m.p)}${isNum(m.H) ? " · " + m.H + " mm" : ""}${
      isNum(m.D) ? " · " + m.D + " mA E-bus" : isNum(m.F) ? " · " + m.F + " mA K-bus" : ""}</title>`;
  g += R(x, 4, W, MH - 4, bg, HW.edge, 2);
  const footY = MH - 20;

  if (k === "ipc" || k === "coupler"){
    const sw = Math.max(15, Math.min(30, W * .14));
    const sx = x + W - sw - 2, lw = sx - x - 6, lx = x + 4;
    const pw = Math.min(lw * .46, 110), bw = Math.min(lw * .28, 62);
    const gw = Math.min(lw - pw - bw - 8, 46);
    let py = 12;
    const rw = Math.min(pw * .52, 34), rh = rw * .58;
    for (let i = 0; i < 2; i++){
      g += rj45(lx, py, rw, rh);
      g += TXT(lx, py + rh + 5, "X00" + (i + 1), 4.2, HW.sub);
      if (k === "ipc" && pw - rw > 26){
        g += usb(lx + rw + 5, py + 1, (pw - rw - 8) * .46, rh * .5);
        g += usb(lx + rw + 5 + (pw - rw - 8) * .52, py + 1, (pw - rw - 8) * .46, rh * .5);
      }
      py += rh + 12;
    }
    if (k === "ipc" && footY - py > 34){                       // DVI style connector
      const dw = Math.min(pw * .62, 34);
      g += R(lx, py, dw, dw * 1.5, HW.metal, HW.edge, 2);
      for (let r0 = 0; r0 < 3; r0++) for (let c0 = 0; c0 < 8; c0++)
        g += `<circle cx="${r2(lx + 4 + c0 * (dw - 8) / 7)}" cy="${r2(py + 8 + r0 * (dw * 1.5 - 16) / 2)}"
              r="1.1" fill="#9A9A9A"/>`;
      g += TXT(lx, py + dw * 1.5 + 5, "X200", 4.2, HW.sub);
    }
    g += ledBox(lx + pw + 4, 12, bw, Math.min(70, footY - 20),
      k === "ipc" ? ["PWR","TC","HDD","F01","F02"] : ["RUN","ERR","LNK","I/O","DIA"],
      k === "ipc" ? 2 : 1);
    if (gw > 12) g += grille(lx + pw + bw + 8, 12, gw, footY - 18);
    g += beckhoffStrip(sx, 6, sw, footY - 10, m.p);
  } else {
    const cols = W >= 22 ? 2 : 1, cw = (W - 6) / cols, gx = x + 3;
    g += R(x, 4, W, 14, tc, null, 2) + R(x, 12, W, 6, tc);          // signal colour on top
    g += `<line x1="${r2(x)}" y1="18" x2="${r2(x + W)}" y2="18" stroke="${HW.edge}" stroke-width=".9"/>`;

    let y = 22;
    const io = ["di","do","ai","ao","com","pos","drv","safe"].includes(ty);
    if (io && k !== "end"){
      const nL = Math.min(ch, cols);
      for (let i = 0; i < nL; i++)
        g += `<circle cx="${r2(gx + cw * (i + .5))}" cy="${r2(y + 4)}" r="3.2"
              fill="${HW.led}" stroke="${HW.pinEdge}" stroke-width=".7"/>`;
      y += 12;
    }
    const lh = (footY - 3 - y) / 4;
    const has = i => m.ct[i] && m.ct[i] !== "---";
    const brk = i => m.ct[i] === "===";
    const lv = [
      {f:"#FFFFFF", l:"", d:1, b:0},
      {f:has(0) ? HW.plus  : "#FFFFFF", l:has(0) ? "+"  : "", d:0, b:brk(0)},
      {f:has(1) ? HW.minus : "#FFFFFF", l:has(1) ? "−"  : "", d:0, b:brk(1)},
      {f:has(2) ? HW.pe    : "#FFFFFF", l:has(2) ? "PE" : "", d:1, b:brk(2)}
    ];
    for (let i = 0; i < 4; i++)
      for (let c = 0; c < cols; c++)
        g += level(gx + cw * (c + .5), y + lh * i + 1, cw, lh, lv[i].f, lv[i].l, lv[i].d, lv[i].b);
    if (W > 16) g += R(x + W - 4.5, footY - 26, 3, 13, HW.latch, null, 1);   // rail latch
  }

  g += foot(x, W, footY + 1, m.p, lum(bg) < .55);
  if (m.bad) g += R(x, 4, W, MH - 4, "rgba(204,0,0,.14)", HW.bx, 2);
  return g + `</g>`;
}

function renderRail(r){
  const groups = groupsOf(r).filter(g => g.at >= 0 || g.mods.length);
  const mods = r.filter(x => x.item || x.missing);
  const total = mods.reduce((s,x) => s + (isNum(x.H) ? x.H : 12), 0);
  const minE = Math.min(...r.filter(x => isNum(x.E)).map(x => x.E), Infinity);
  const minG = Math.min(...r.filter(x => isNum(x.G)).map(x => x.G), Infinity);

  $("rv-stats").innerHTML = [
    `${t().sModules} <b>${mods.length}</b>`,
    groups.length > 1 ? `${t().d.rails} <b>${groups.length}</b>` : "",
    `${t().sWidth} <b>${total} mm</b>`,
    isFinite(minE) ? `E-bus <b class="${minE < 0 ? "neg" : ""}">${minE} mA</b>` : "",
    isFinite(minG) ? `K-bus <b class="${minG < 0 ? "neg" : ""}">${minG} mA</b>` : ""
  ].filter(Boolean).join("");

  if (!groups.length){ $("strip").innerHTML = `<div class="cb-empty">${esc(t().empty)}</div>`; return; }
  const widest = Math.max(...groups.map(g => g.total), 60);
  const px = Math.max(1.9, Math.min(4.2, 1250 / Math.max(widest, 200))) * zoom;
  $("strip").innerHTML = groups.map(g => railBlock(g, px)).join("");
}
function railBlock(g, px){
  const d = t().d;
  return `<div class="railgrp">
    <div class="rg-head"><span class="rg-k">${esc(d.railN)}</span>
      <input class="rg-name" data-at="${g.at}" value="${esc(g.name || "")}"
        placeholder="${esc(g.label)}" spellcheck="false" aria-label="${esc(d.name)}">
      <span class="rg-n">${g.mods.length} ${esc(g.mods.length === 1 ? d.mods1 : d.mods)} · ${g.total} mm</span></div>
    ${g.mods.length ? railSvg(g.mods, g.total, 1, null, px)
      : `<div class="rg-empty">${esc(d.emptyRail)}</div>`}</div>`;
}
/* renaming a rail from its header must not rebuild the view under the cursor */
$("strip").addEventListener("input", e => {
  if (!e.target.classList.contains("rg-name")) return;
  const at = +e.target.dataset.at, v = e.target.value;
  if (at < 0) firstRail = v; else rows[at].n = v;
  const tw = document.querySelector(`tr[data-i="${at}"] .dname`);
  if (tw) tw.value = v;
});

function railSvg(mods, total, z, fit, pxFix){
  const px = pxFix ? pxFix
           : fit ? Math.max(1.6, Math.min(4.6, fit / Math.max(total, 60)))
                 : Math.max(1.9, Math.min(4.2, 1250 / Math.max(total, 200))) * z;
  const w = x => Math.max(7, (isNum(x.H) ? x.H : 12) * px);
  const padL = 44, padR = 44;
  const cY = [MH + 22, MH + 35, MH + 48];
  const barTop = MH + 62, barH = 34, base = barTop + barH;
  const rulerY = base + 16, H = rulerY + 16;
  const W = padL + mods.reduce((s,x) => s + w(x), 0) + padR;

  let s = `<svg xmlns="http://www.w3.org/2000/svg" width="${r2(W)}" height="${H}" viewBox="0 0 ${r2(W)} ${H}"
    font-family="Helvetica,Arial,sans-serif">
    <defs>
      <linearGradient id="railg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${HW.rail1}"/><stop offset=".45" stop-color="${HW.rail2}"/>
        <stop offset="1" stop-color="${HW.rail3}"/></linearGradient>
    </defs>`;

  // DIN rail behind the modules, protruding at both ends
  const rx0 = 2, rw = W - 4, ry = MH * .55, rh = 32;
  s += R(rx0, ry, rw, rh, "url(#railg)", "#8E8E8E");
  s += R(rx0, ry, rw, 3, "#F4F4F4") + R(rx0, ry + rh - 3, rw, 3, "#9A9A9A");
  for (let i = 0; i < rw / 30; i++)
    s += R(rx0 + 10 + i * 30, ry + rh / 2 - 2.5, 12, 5, "#AFAFAF", null, 1);

  // modules
  let x = padL;
  for (const m of mods){ s += drawModule(x, w(m), m); x += w(m); }

  // power contact rails
  const nm = ["+","−","PE"];
  for (let k = 0; k < 3; k++){
    s += `<text x="${padL - 10}" y="${cY[k] + 3}" class="svg-lbl" font-size="8" text-anchor="end">${nm[k]}</text>`;
    let cx = padL;
    for (const m of mods){
      const c = m.ct[k], W2 = w(m), y = cY[k];
      const live = c === "|" || c === "T" || c === "-T-";
      if (live){
        s += R(cx, y - 1.3, W2, 2.6, HW.brass);
        if (c === "T" || c === "-T-"){
          s += `<circle cx="${r2(cx + W2 / 2)}" cy="${y}" r="4" fill="${HW.brass}" stroke="#8A6F14" stroke-width=".8"/>`;
          s += `<path d="M${r2(cx + W2 / 2)} ${y - 12} v6" stroke="#8A6F14" stroke-width="1.4"/>`;
          s += `<path d="M${r2(cx + W2 / 2 - 2.5)} ${y - 7.5} l2.5 3 2.5-3z" fill="#8A6F14"/>`;
        }
      } else if (c === "===" ){
        s += R(cx + W2 / 2 - 1, y - 6, 2, 12, "#CC0000");
      } else if (c === "---"){
        s += `<path d="M${r2(cx + 2)} ${y} h${r2(W2 - 4)}" stroke="#B0B0B0" stroke-width="1.4" stroke-dasharray="2 2"/>`;
      }
      if (m.ctBad[k]) s += R(cx, y - 6, W2, 12, "rgba(204,0,0,.16)", "#CC0000");
      cx += W2;
    }
  }

  // residual current band
  const vals = mods.map(m => isNum(m.E) ? {v:m.E, bus:"E"} : (isNum(m.G) ? {v:m.G, bus:"K"} : null));
  const peak = Math.max(...vals.filter(Boolean).map(o => Math.abs(o.v)), 1);
  s += `<line x1="${padL}" y1="${base}" x2="${r2(W - padR)}" y2="${base}" class="svg-ln"/>`;
  s += `<text x="${padL - 10}" y="${base + 3}" class="svg-lbl" font-size="8" text-anchor="end">0</text>`;
  x = padL;
  vals.forEach((o,i) => {
    const W2 = w(mods[i]);
    if (o){
      const hgt = Math.max(2, Math.abs(o.v) / peak * (barH - 3));
      const col = o.v < 0 ? "#CC0000" : (o.bus === "E" ? "#00648D" : "#2E7D6F");
      s += `<g opacity="${o.v < 0 ? 1 : .78}">` +
           R(x + 1.4, o.v < 0 ? base : base - hgt, Math.max(1, W2 - 2.8), hgt, col) + `</g>`;
    }
    x += W2;
  });

  // scale ruler
  s += `<line x1="${padL}" y1="${rulerY}" x2="${r2(padL + total * px)}" y2="${rulerY}" class="svg-ln"/>`;
  const step = total > 900 ? 200 : total > 400 ? 100 : 50;
  for (let mm = 0; mm <= total; mm += step){
    const tx = padL + mm * px;
    s += `<line x1="${r2(tx)}" y1="${rulerY}" x2="${r2(tx)}" y2="${rulerY + 4}" class="svg-ln"/>`;
    s += `<text x="${r2(tx)}" y="${rulerY + 13}" class="svg-lbl" font-size="8" text-anchor="middle">${mm}</text>`;
  }
  s += `<text x="${r2(padL + total * px + 6)}" y="${rulerY + 13}" class="svg-lbl" font-size="8">mm</text>`;
  return s + `</svg>`;
}

function renderPanel(r){
  const issues = [];
  r.forEach((x,i) => x.msgs.forEach(m => issues.push([i+1,m])));
  const n = issues.length, has = r.some(x => x.item || x.missing);

  $("issue-count").textContent = n ? n : "";
  const s = $("status");
  s.className = "status " + (n ? "err" : "ok");
  $("status-text").textContent = n ? t().bad(n) : (has ? t().ok : t().empty);
  $("issues").innerHTML = issues.map(([nr,m]) =>
    `<li data-nr="${nr}"><b>${nr}</b><span>${esc(m)}</span></li>`).join("");

  const mods = r.filter(x => x.item);
  const total = mods.reduce((a,x) => a + (isNum(x.H) ? x.H : 0), 0);
  const minE = Math.min(...r.filter(x => isNum(x.E)).map(x => x.E), Infinity);
  const minG = Math.min(...r.filter(x => isNum(x.G)).map(x => x.G), Infinity);
  const types = new Set(mods.map(x => x.p));
  const row = (k,v,neg) => `<dt>${esc(k)}</dt><dd class="${neg ? "neg" : ""}">${esc(v)}</dd>`;

    (isFinite(minG) ? row(t().sK, minG + " mA", minG < 0) : "");

  const cnt = new Map();
  mods.forEach(x => cnt.set(x.p, (cnt.get(x.p) || 0) + 1));
  const list = [...cnt.entries()].sort((a,b) => a[0].localeCompare(b[0]));

  $("bom").innerHTML = list.map(([p,c]) => `<tr><td>${esc(p)}</td><td>${c}</td></tr>`).join("");

  $("legend").innerHTML =
    Object.entries(t().types).map(([k,v]) =>
      `<div><span class="sw" style="background:${TYPE_COL[k]}"></span><span>${esc(v)}</span></div>`).join("") +
    `<div style="height:7px"></div>` +
    Object.entries(t().lg).map(([k,v]) => `<div><code>${esc(k)}</code><span>${esc(v)}</span></div>`).join("") +
    `<div style="margin-top:6px"><span class="sw" style="background:#F4E6C8;border-color:#DCC48E"></span>
       <span>${esc(t().lgSupply)}</span></div>
     <div><span class="sw" style="background:var(--shade)"></span><span>${esc(t().lgShade)}</span></div>
     <div><span class="sw" style="background:var(--red-soft);border-color:var(--red)"></span>
       <span>${esc(t().lgBad)}</span></div>`;
  $("l-note").textContent = t().note;
}

/* ---------------- combobox ---------------- */
let cb = null;
function closeCb(){ if (cb){ cb.list.remove(); cb = null; } }

function search(q){
  q = q.trim().toLowerCase();
  if (!q) return [];
  const a = [], b = [], c = [];
  for (const k of KEYS){
    const lk = k.toLowerCase();
    if (lk.startsWith(q)) a.push(k);
    else if (lk.includes(q)) b.push(k);
    else if (c.length < 12 && q.length > 3){
      const it = BY.get(k);
      if ((lang === "de" ? it.dd : it.de).toLowerCase().includes(q)) c.push(k);
    }
    if (a.length > 45) break;
  }
  return [...a, ...b, ...c].slice(0, 45);
}

function openCb(input, i){
  closeCb();
  const hits = search(input.value);
  const list = document.createElement("div");
  list.className = "cb-list";
  if (!hits.length){ list.innerHTML = `<div class="cb-empty">${esc(t().noHit)}</div>`; }
  else list.innerHTML = hits.map((k,j) => {
    const it = BY.get(k);
    const cur = isNum(it.e) ? it.e + " mA E" : (isNum(it.k) ? it.k + " mA K" : "");
    return `<div class="cb-item${j ? "" : " on"}" data-k="${esc(k)}">
      <b>${esc(k)}</b><i>${esc((lang === "de" ? it.dd : it.de).split("\n")[0])}</i><em>${esc(cur)}</em></div>`;
  }).join("");
  input.parentNode.appendChild(list);
  cb = { list, input, i, hits };
  list.addEventListener("mousedown", e => {
    const el = e.target.closest(".cb-item"); if (!el) return;
    e.preventDefault(); pick(el.dataset.k);
  });
}
function pick(k){
  if (!cb) return;
  const i = cb.i;
  rows[i].p = k; cb.input.value = k;
  closeCb(); refresh();
  document.querySelector(`tr[data-i="${i}"] .c-cm input`)?.focus();
}
function moveCb(d){
  if (!cb) return;
  const items = [...cb.list.querySelectorAll(".cb-item")];
  if (!items.length) return;
  let i = items.findIndex(x => x.classList.contains("on"));
  items[i]?.classList.remove("on");
  i = (i + d + items.length) % items.length;
  items[i].classList.add("on");
  items[i].scrollIntoView({block:"nearest"});
}

$("tbody").addEventListener("input", e => {
  const tr = e.target.closest("tr"); const i = +tr.dataset.i;
  if (e.target.classList.contains("p")){ rows[i].p = e.target.value; openCb(e.target, i); refresh(); }
  else if (e.target.classList.contains("c")) rows[i].c = e.target.value;
  else if (e.target.classList.contains("dname")){
    rows[i].n = e.target.value;
    const sw = document.querySelector(`#strip .rg-name[data-at="${i}"]`);
    if (sw) sw.value = e.target.value; else refresh();
  }
});
$("tbody").addEventListener("keydown", e => {
  if (!e.target.classList.contains("p")) return;
  const i = +e.target.closest("tr").dataset.i;
  if (e.key === "ArrowDown"){ e.preventDefault(); cb ? moveCb(1) : openCb(e.target, i); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); moveCb(-1); }
  else if (e.key === "Enter"){
    e.preventDefault();
    const on = cb && cb.list.querySelector(".cb-item.on");
    if (on) pick(on.dataset.k); else { closeCb(); refresh(); }
  } else if (e.key === "Escape") closeCb();
});
$("tbody").addEventListener("blur", e => { if (e.target.classList.contains("p")) setTimeout(closeCb, 120); }, true);
$("tbody").addEventListener("click", e => {
  const af = e.target.closest(".addrow button");
  if (af){
    if (af.classList.contains("ra")){ ensureRail(); rows.push({p:"",c:""}); }
    else {
      while (rows.length && !rows[rows.length-1].d && !rows[rows.length-1].p.trim()) rows.pop();
      rows.push({d:1, k:"rail", n:""}, {p:"", c:""});
    }
    render();
    const last = document.querySelector(`tr[data-i="${rows.length-1}"]`);
    (last?.querySelector(".p") || document.querySelector(`tr[data-i="${rows.length-2}"] .dname`))?.focus();
    return;
  }
  const b = e.target.closest("button"); if (!b) return;
  const i = +e.target.closest("tr").dataset.i;
  const snapshot = JSON.stringify(rows);
  if (b.classList.contains("up") && i > 0) [rows[i-1],rows[i]] = [rows[i],rows[i-1]];
  else if (b.classList.contains("dn") && i < rows.length-1) [rows[i+1],rows[i]] = [rows[i],rows[i+1]];
  else if (b.classList.contains("ins"))
    rows.splice(i, 0, e.shiftKey ? {d:1, k:"rail", n:""} : {p:"", c:""});
  else if (b.classList.contains("dup")){
    let n = 1;
    if (e.shiftKey){
      const v = prompt(t().act.howMany, "10");
      if (v === null) return;
      n = Math.max(1, Math.min(300, parseInt(v, 10) || 1));
    }
    rows.splice(i + 1, 0, ...Array.from({length:n}, () => rows[i].d
      ? {d:1, k:rows[i].k, n:rows[i].n} : {p:rows[i].p, c:rows[i].c}));
  }
  else if (b.classList.contains("del")) rows.splice(i, 1);
  if (rows.length && !rows[0].d) rows = JSON.parse(snapshot);   // a rail must stay on top
  closeCb(); render();
});

function buildReport(orient){
  const x = t(), rep = x.rep, r = compute();
  const groups = groupsOf(r).filter(g => g.mods.length);
  const mods = r.filter(m => m.item || m.missing);
  const total = mods.reduce((s,m) => s + (isNum(m.H) ? m.H : 0), 0);
  const minE = Math.min(...r.filter(m => isNum(m.E)).map(m => m.E), Infinity);
  const minG = Math.min(...r.filter(m => isNum(m.G)).map(m => m.G), Infinity);
  const issues = [];
  r.forEach((m,i) => m.msgs.forEach(s => issues.push([i+1, s])));
  const withDesc = $("pd-desc").checked;
  const date = new Date().toLocaleString(lang === "sv" ? "sv-SE" : lang === "de" ? "de-DE" : "en-GB",
    {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const fitW = orient === "landscape" ? 1000 : 690;
  const widest = Math.max(...groups.map(g => g.total), 60);
  const repPx = Math.max(1.5, Math.min(3.2, fitW / Math.max(widest, 60)));
  const cut = (s,n) => { s = String(s || "").replace(/\s+/g," ").trim();
                         return s.length > n ? s.slice(0, n - 1) + "…" : s; };

  /* two-row header: groups on top, units below */
  const rs = ' rowspan="2"', c = rep;
  const head = `<tr>
      <th class="n"${rs}>${esc(c.cNr)}</th><th${rs}>${esc(c.cArt)}</th>
      ${withDesc ? `<th${rs}>${esc(c.cDesc)}</th>` : ""}
      <th class="grp" colspan="2">${esc(c.cE)}</th>
      <th class="grp" colspan="2">${esc(c.cK)}</th>
      <th class="grp" colspan="2">${esc(c.cW)}</th>
      <th class="grp" colspan="3">${esc(c.cCt)}</th>
      <th${rs}>${esc(c.cCom)}</th></tr>
    <tr>
      <th class="n">${esc(c.cCur)}</th><th class="n">${esc(c.cRes)}</th>
      <th class="n">${esc(c.cCur)}</th><th class="n">${esc(c.cRes)}</th>
      <th class="n">${esc(c.cWmm)}</th><th class="n">${esc(c.cTot)}</th>
      <th class="c">+</th><th class="c">−</th><th class="c">PE</th></tr>`;
  const cols = 10 + (withDesc ? 1 : 0) + 2;

  let nr = 0;
  const body = r.filter(m => m.div || m.item || m.missing).map(m => {
    if (m.div) return `<tr class="divr"><td colspan="${cols}">
      <b>${esc((m.dk === "station" ? x.d.stationN : x.d.railN) + " " + (m.label0 || ""))}</b>${
      m.msgs.length ? ` <span class="warn">— ${esc(m.msgs[0])}</span>` : ""}</td></tr>`;
    const cell = (v, cls) => `<td class="${cls}">${esc(fmt(v))}</td>`;
    return `<tr><td class="n">${++nr}</td><td class="art">${esc(m.p)}</td>` +
      (withDesc ? `<td class="dsc">${esc(m.missing ? x.e.unknown : cut(m.desc, 78))}</td>` : "") +
      cell(m.D,"n") + cell(m.E, "n" + (m.eBad ? " bad" : m.eShade ? " sh" : "")) +
      cell(m.F,"n") + cell(m.G, "n" + (m.gBad ? " bad" : m.gShade ? " sh" : "")) +
      cell(m.H,"n") + cell(m.I, "n" + (m.iShade ? " sh" : "")) +
      m.ct.map((v,k) => `<td class="c${m.ctBad[k] ? " bad" : ""}">${esc(v)}</td>`).join("") +
      `<td>${esc(cut(m.c, 40))}</td></tr>`;
  }).join("");

  const cnt = new Map();
  mods.filter(m => m.item).forEach(m => cnt.set(m.p, (cnt.get(m.p) || 0) + 1));
  const parts = [...cnt.entries()].sort((a,b) => a[0].localeCompare(b[0]))
    .map(([p,n]) => `<li>${esc(p)}<span>${n}</span></li>`).join("");

  const kpi = (lab, val, neg) => `<div><span>${esc(lab)}</span><b class="${
    neg ? "neg" : ""}">${esc(val)}</b></div>`;

  $("print-report").innerHTML = `
    <div class="rep-head">
      ${logoData ? `<img src="${logoData}" alt="">` : ""}
      <div><p class="rep-title">${esc(x.title)}</p><p class="rep-sub">${esc(rep.report)}</p></div>
      <div class="rep-meta"><b>${esc($("proj").value || "—")}</b>
        <div>${esc(rep.made)} ${esc(date)}</div></div>
    </div>
    <div class="rule"></div>

    <div class="rep-status${issues.length ? " bad" : ""}">${
      issues.length ? "⚠ " + esc(x.bad(issues.length)) : "✓ " + esc(x.ok)}</div>

    <div class="kpi">
      ${kpi(x.sModules, mods.length)}
      ${groups.length > 1 ? kpi(x.d.rails, groups.length) : ""}
      ${kpi(x.sTypes, cnt.size)}
      ${kpi(x.sWidth, total + " mm")}
      ${isFinite(minE) ? kpi(x.sE, minE + " mA", minE < 0) : ""}
      ${isFinite(minG) ? kpi(x.sK, minG + " mA", minG < 0) : ""}
    </div>

    ${issues.length ? `<div class="sec"><h3>${esc(rep.errs)}</h3>
      <ol class="errs">${issues.map(([n,s]) =>
        `<li><b>${esc(x.th[0])} ${n}</b>${esc(s)}</li>`).join("")}</ol></div>` : ""}

    ${groups.length ? `<h3>${esc(rep.railview)}</h3>` + groups.map(g => `<div class="rep-strip sec">
      <div class="rep-rg">${esc(x.d.railN)} <b>${esc(g.label)}</b> · ${
        g.mods.length} ${esc(g.mods.length === 1 ? x.d.mods1 : x.d.mods)} · ${g.total} mm</div>
      ${railSvg(g.mods, g.total, 1, null, repPx)}</div>`).join("") : ""}

    <h3>${esc(rep.conf)}</h3>
    <table><thead>${head}</thead><tbody>${body}</tbody></table>

    <div class="sec"><h3>${esc(rep.parts)}</h3>
    <ul class="parts">${parts}</ul></div>

    <div class="rep-foot">${esc(x.note)}</div>`;
}
